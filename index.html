// ===================== DRAW: WORLD OBJECTS =====================
const critterFx = { acc: null, heartEyes: false, rot: 0, nap: false, sq: 0 }; // reused every frame
function drawCritter(c) {
  const bounce = (typeof kind !== "undefined" && kind && kind.motion) ? 0 : c.state === "happy" ? Math.sin(c.stateT * 18) * 8
    : c.dancing ? Math.sin(c.phase * 2) * 6
    : (c.idle === "wave" && c.state === "float") ? -Math.abs(Math.sin(time * 9)) * 4 : 0;
  let rot = 0;
  if (c.spinT > 0) rot = (1 - c.spinT / 0.6) * Math.PI * 2;
  else if (c.idle === "wave" && c.state === "float") rot = Math.sin(time * 9) * 0.2;
  // squash & stretch: a damped wobble after each hug/pet, plus a tiny idle "breath"
  let sq = c.sqT < 1.3 ? c.sqAmp * Math.sin(c.sqT * 21) * Math.exp(-c.sqT * 5.5) : 0;
  if (c.state === "float" && !c.sad) sq += Math.sin(c.phase * 0.9) * (c.idle === "nap" ? 0.035 : 0.02);
  const fx = critterFx;
  fx.acc = equippedFor(c.animal.id); fx.heartEyes = c.heartEyesT > 0; fx.rot = rot;
  fx.nap = c.idle === "nap" && c.state === "float"; fx.sq = (typeof kind !== "undefined" && kind && kind.motion) ? 0 : sq;
  if (c.idle === "gaze" && c.state === "float") fx.rot = -0.14;
  let skyOx = 0;
  if (typeof skyPose === "function") skyOx = skyPose(c, fx) || 0;
  drawCritterGlow(c);
  drawSprite(c.animal, c.x + skyOx, c.y, c.scale * c.hugScale, c.shiny, bounce, c.sad, c.phase, fx);
  const s = c.scale * SPRITE_SIZE;
  if (c.idle === "gaze" && c.state === "float") drawGazeTwinkle(c);
  if (c.idle === "wave" && c.state === "float") {
    font(10, true); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#ff70a8";
    ctx.fillText("hi!", c.x + s * 0.42, c.y - s * 0.5);
  }
  if (c.parade && c.state === "float") {
    font(11, true); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#ff80b0";
    ctx.fillText("♪", c.x, c.y - s * 0.62 + Math.sin(time * 6 + c.phase) * 3);
  }
}

function drawPowerup(p) {
  const pulse = 1 + Math.sin(time * 6 + p.ph) * 0.06;
  const r = 20 * pulse;
  const info = POWERUPS[p.type];
  ctx.save();
  ctx.globalAlpha = Math.min(1, p.life);
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = info.col; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.beginPath(); ctx.ellipse(p.x - r * 0.4, p.y - r * 0.45, r * 0.25, r * 0.14, -0.6, 0, Math.PI * 2); ctx.fill();
  if (p.type === "bighug") {
    drawPixelHeart(p.x, p.y, 11, "#ff5a9a");
  } else if (p.type === "sunbeam") {
    ctx.strokeStyle = "#ffb020"; ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * Math.PI * 2 + time;
      ctx.beginPath(); ctx.moveTo(p.x + Math.cos(a) * 9, p.y + Math.sin(a) * 9); ctx.lineTo(p.x + Math.cos(a) * 13, p.y + Math.sin(a) * 13); ctx.stroke();
    }
    ctx.fillStyle = "#ffd040"; ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, Math.PI * 2); ctx.fill();
  } else if (p.type === "magnet") {
    ctx.strokeStyle = "#ff5a5a"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(p.x, p.y - 2, 7, 0, Math.PI); ctx.stroke();
    ctx.fillStyle = "#e8e8f0";
    ctx.fillRect(p.x - 10, p.y - 7, 6, 5); ctx.fillRect(p.x + 4, p.y - 7, 6, 5);
  } else {
    ctx.strokeStyle = "#4a90d0"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y - 6); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 4, p.y + 2); ctx.stroke();
  }
  font(9, true); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#6a3a60";
  ctx.fillText(info.name.replace(/[!…]/g, ""), p.x, p.y + r + 8);
  ctx.restore();
}

function drawDrop(d) {

}

function drawEventOverlay() {
  if (!activeEvent) return;
  if (activeEvent.type === "golden") {
    const a = Math.min(1, activeEvent.t, (activeEvent.dur - activeEvent.t)) * 0.2;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "rgba(255,190,80," + (a * 1.3) + ")");
    g.addColorStop(1, "rgba(255,150,90," + (a * 0.6) + ")");
    ctx.fillStyle = g;

// Title wordmark: Fredoka Bold (embedded as HC Display). Even, rounded, high contrast.
function drawPixelHeart(x, y, s) {
  const g = [".#.#.", "#####", "#####", ".###.", "..#.."];
  const x0 = Math.round(x - 2.5 * s), y0 = Math.round(y - 2.5 * s);
  const dots = [];
  for (let r = 0; r < g.length; r++) for (let c = 0; c < g[r].length; c++) if (g[r][c] === "#") dots.push([x0 + c * s, y0 + r * s]);
  ctx.fillStyle = "#c43a68";
  for (const [px, py] of dots) {
    ctx.fillRect(px - s, py, s, s); ctx.fillRect(px + s, py, s, s);
    ctx.fillRect(px, py - s, s, s); ctx.fillRect(px, py + s, s, s);
  }
  ctx.fillStyle = "#ff6b9d";
  for (const [px, py] of dots) ctx.fillRect(px, py, s, s);
  ctx.fillStyle = "#ffd0e4";
  ctx.fillRect(x0 + s, y0 + s, s, s);
}

function openPanel(name) {
  if (scene === "play" || scene === "title") prevScene = scene;
  if (scene === "play" && (name === "garden" || name === "arcade")) prevScene = "pause"; // come back to a paused meadow, never an ambush
  if (scene === "pause") prevScene = "pause";
  scene = name;
  listScroll = 0; listMax = 0;
  drag = null;
}

function doUI(id) {
  if (!id) return;
  sfxClick();
  if (typeof v15Action === "function" && v15Action(id)) return;
  if (typeof v12Action === "function" && v12Action(id)) return;
  if (kindAction(id)) return;
  if (typeof partyAction === "function" && partyAction(id)) return;
  if (id === "play") { startPlay(); return; }
  if (id === "tut_next") { tutNext(); return; }
  if (id === "tut_skip") { finishTutorial(true); return; }
  if (id === "tut_replay") { tutorialDone = false; save(); startPlay(); return; }
  if (id === "tog_haptics") { hapticsOn = !hapticsOn; save(); if (hapticsOn) buzz("unlock", true); return; }
  if (id === "whatsnew") { openWhatsNew(scene); return; }
  if (id === "wn_ok") { closeWhatsNew(); return; }
  if (id === "sw_refresh") { save(); try { location.reload(); } catch (e) {} return; }
  if (id === "dawn") { newDawn(); return; }
  if (id === "shop") { if (tut && tut.step === 3) finishTutorial(false, true); shopTab = "critters"; openPanel("shop"); return; }
  if (id === "ach") { checkAchievements(); openPanel("achievements"); return; }
  if (id === "album") { albumNew = false; openPanel("album"); weekBump("album"); save(); return; }
  if (id === "settings") { openPanel("settings"); return; }
  if (id === "seasons") { scene = "seasons"; return; }
  if (id.startsWith("sea_")) { seasonsAction(id); return; }
  if (id === "scr_up") { listScroll = clamp(listScroll - 180, 0, listMax); return; }
  if (id === "scr_dn") { listScroll = clamp(listScroll + 180, 0, listMax); return; }
  if (id === "tog_music") { setMusicOn(!musicOn); if (musicOn) ensureAudio(); return; }
  if (id === "tog_sfx") { setSfxOn(!sfxOn); sfxClick(); return; }
  if (id === "pause") { scene = "pause"; save(); return; }
  if (id === "resume") { scene = "play"; return; }
  if (id === "title") { scene = "title"; prevScene = "title"; activeEvent = null; drops = []; powerups = []; magnetT = slowT = 0; tut = null; save(); return; }
  if (id === "close") {
    if (scene === "seasons") { scene = "settings"; return; }
    if (scene === "garden") { leaveGarden(); return; }
    if (scene === "decor") { scene = "garden"; return; }
    scene = prevScene || "title"; return;
  }
  if (id === "garden") { if (tut) return; openGarden(); return; }
  if (id === "arcade") { if (tut) return; openArcade(); return; }
  if (id.startsWith("arc_")) { arcadeAction(id); return; }
  if (id.startsWith("mg_")) { mgAction(id); return; }
  if (id === "adventure") { if (tut) return; openAdvMap(); return; }
  if (id.startsWith("adv_")) { advAction(id); return; }
  if (id === "decor") { gSel = null; const ps = prevScene; openPanel("decor"); prevScene = ps; return; }
  if (id === "away_ok") { collectAway(); return; }
  if (id.startsWith("g_")) { gardenAction(id); return; }
  if (id.startsWith("dtab_")) { decorTab = id.slice(5); listScroll = 0; return; }
  if (id.startsWith("dbuy_")) {
    const did = id.slice(5);
    if (buyDecor(did)) { scene = "garden"; placeFromInv(did); }
    return;
  }
  if (id.startsWith("dplace_")) { const did = id.slice(7); scene = "garden"; placeFromInv(did); return; }
  if (id.startsWith("tab_")) { shopTab = id.slice(4); listScroll = 0; return; }
  if (id.startsWith("buy_")) {
    const a = ANIMALS.find(x => x.id === id.slice(4));
    if (a && !a.special && a.adv == null && !unlocked[a.id] && joy >= a.cost && seasonOpen(a)) {
      joy -= a.cost; unlocked[a.id] = true; sfxUnlock(); buzz("unlock");
      toast(a.name + " joined! ♥", C.heart);
      checkAchievements(); save();
    }
    return;
  }
  if (id.startsWith("buybg_")) {
    const b = BACKGROUNDS.find(x => x.id === id.slice(6));
    if (b && !unlockedBgs[b.id] && joy >= b.cost) {
      joy -= b.cost; unlockedBgs[b.id] = true; bgId = b.id; sfxUnlock(); buzz("unlock");
      checkAchievements(); save();
    }
    return;
  }
  if (id.startsWith("usebg_")) {
    const bid = id.slice(6);
    if (unlockedBgs[bid]) { bgId = bid; save(); }
    return;
  }
  if (id.startsWith("buyacc_")) {
    const acc = SHOP_ACCS.find(x => x.id === id.slice(7));
    if (acc && !ownedAcc[acc.id] && joy >= acc.cost) {
      joy -= acc.cost; ownedAcc[acc.id] = true; sfxUnlock(); buzz("unlock");
      toast(acc.name + " added to your wardrobe!", C.heart);
      checkAchievements(); save();
    }
    return;
  }
  if (id.startsWith("wear_")) {
    const aid = id.slice(5);
    const opts = [null].concat(accOptions(aid).map(a => a.id));
    if (opts.length <= 1) { toast("Buy accessories in the Shop, or level up friendship!", C.textSoft); return; }
    const cur = equippedFor(aid);
    const next = opts[(opts.indexOf(cur) + 1) % opts.length];
    if (next) equipped[aid] = next; else delete equipped[aid];
    checkAchievements(); save();
  }
}

// ===================== INPUT =====================
function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  const clientX = e.clientX != null ? e.clientX : (e.touches && e.touches[0] && e.touches[0].clientX);
  const clientY = e.clientY != null ? e.clientY : (e.touches && e.touches[0] && e.touches[0].clientY);
  return { x: ((clientX - r.left) / r.width) * W, y: ((clientY - r.top) / r.height) * H };
}
const LIST_SCENES = { shop: true, album: true, achievements: true, decor: true, settings: true, wishes: true, market: true, dye: true };
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);

function tapGloom(p) {
  for (let i = gloomClouds.length - 1; i >= 0; i--) {
    const gc = gloomClouds[i];
    const rad = Math.max(26, 28 * gc.s);
    if (dist2(p.x, p.y, gc.x + 16 * gc.s, gc.y) < rad * rad) { shooGloom(gc); return true; }
  }
  return false;
}

// One full hug per critter per ~0.42s, and only two pays in the same moment,
// so a 5-finger tap is not five hugs. A second finger still gets a small share.
const HUG_CALM = 0.42;
let hugWaveT = -10, hugWaveN = 0;
function hugOffer(c) {
  if (!c || c.state !== "float") return 0;
  if (c.calmUntil && time < c.calmUntil) return 0;
  if (time - hugWaveT > 0.5) { hugWaveT = time; hugWaveN = 0; }
  if (hugWaveN >= 2) return 0;
  hugWaveN++;
  c.calmUntil = time + HUG_CALM;
  return hugWaveN === 1 ? 1 : 0.35;
}
function playTap(p) {
  if (typeof tapSky === "function" && tapSky(p)) return;
  if (gift && dist2(p.x, p.y, gift.x, gift.y) < 36 * 36) { openGift(); return; }
  for (const pu of powerups) {
    if (!pu.dead && dist2(p.x, p.y, pu.x, pu.y) < 27 * 27) { activatePowerup(pu); prune(powerups, notDead); return; }
  }
  let bestDrop = null, bdd = 26 * 26;
  for (const d of drops) { const dd = dist2(p.x, p.y, d.x, d.y); if (dd < bdd) { bestDrop = d; bdd = dd; } }
  if (bestDrop) { catchDrop(bestDrop); prune(drops, notDead); return; }
  if (tapSeason(p)) return;
  if (tapGloom(p)) return;
  let best = null, bestD = 1e9;
  for (let i = critters.length - 1; i >= 0; i--) {
    const c = critters[i];
    if (c.state !== "float") continue;
    const rad = Math.max(24, c.scale * SPRITE_SIZE * 0.5);
    const d = dist2(p.x, p.y, c.x, c.y);
    if (d < rad * rad && d < bestD) { best = c; bestD = d; }
  }
  if (!best && tapFirefly(p)) return;
  if (best) {
    for (const gc of gloomClouds) {
      if (dist2(best.x, best.y, gc.x + 16 * gc.s, gc.y) < 55 * 55) shooGloom(gc);
    }
    const pay = hugOffer(best);
    if (pay) hugCritter(best, 1, pay);
    return;
  }
  for (let i = critters.length - 1; i >= 0; i--) {
    const c = critters[i];
    if (c.state !== "happy") continue;
    const rad = Math.max(24, c.scale * SPRITE_SIZE * 0.55);
    if (dist2(p.x, p.y, c.x, c.y) < rad * rad) { petCritter(c); return; }
  }
  if (tapDreamJar(p)) return;
}

canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  ensureAudio();
  const p = canvasPos(e);
  hitUI = p;
  pointer.x = p.x; pointer.y = p.y; pointer.down = true;
  if (LIST_SCENES[scene]) {
    drag = { y0: p.y, s0: listScroll, moved: false };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    return;
  }
  for (const b of uiButtons) {
    if (pointIn(p.x, p.y, b.x, b.y, b.w, b.h)) { doUI(b.id); return; }
  }
  if (scene === "garden") { gardenDown(p, e.pointerType !== "mouse"); try { canvas.setPointerCapture(e.pointerId); } catch (err) {} return; }
  if (scene === "boat" && typeof boatTap === "function") { boatTap(p); try { canvas.setPointerCapture(e.pointerId); } catch (err) {} return; }
  if (scene === "skip" && typeof skipTap === "function") { skipTap(p); return; }
  if (scene === "mg") { mgDown(p); try { canvas.setPointerCapture(e.pointerId); } catch (err) {} return; }
  if (isAdvScene(scene)) { advPointer(p); return; }
  if (scene === "play" && tut && tutBubbleHit(p)) return; // the tutorial card swallows stray taps
  if (scene === "play") playTap(p);
  else if (scene === "title") tapGloom(p);
}, { passive: false });

canvas.addEventListener("pointermove", (e) => {
  const p = canvasPos(e);
  if (e.pointerType === "mouse" || pointer.down) { hitUI = p; pointer.x = p.x; pointer.y = p.y; }
  if (gDrag && scene === "garden") gardenMove(p);
  if (scene === "mg") mgMove(p);
  if (scene === "boat" && typeof boatMove === "function") boatMove(p);
  if (drag) {
    const dy = p.y - drag.y0;
    if (Math.abs(dy) > 8) drag.moved = true;
    if (drag.moved) listScroll = clamp(drag.s0 - dy, 0, listMax);
  }
});
function endPointer(e, cancelled) {
  const p = canvasPos(e);
  if (drag && !drag.moved && !cancelled && LIST_SCENES[scene]) {
    for (const b of uiButtons) {
      if (pointIn(p.x, p.y, b.x, b.y, b.w, b.h)) { doUI(b.id); break; }
    }
  }
  drag = null;
  if (gDrag) gardenUp(p, cancelled || scene !== "garden");
  if (typeof boatUp === "function") boatUp();
  pointer.down = false;
  if (e.pointerType !== "mouse") hitUI = null;
}
canvas.addEventListener("pointerup", (e) => endPointer(e, false));
canvas.addEventListener("pointercancel", (e) => endPointer(e, true));
canvas.addEventListener("wheel", (e) => {
  if (!LIST_SCENES[scene]) return;
  e.preventDefault();
  listScroll = clamp(listScroll + e.deltaY, 0, listMax);
}, { passive: false });
// no pinch-zoom / double-tap zoom / long-press menus
["gesturestart", "gesturechange", "dblclick", "contextmenu", "selectstart"].forEach(ev =>

document.addEventListener("touchmove", (e) => { if (e.touches && e.touches.length > 1 || e.target === canvas) e.preventDefault(); }, { passive: false });

window.addEventListener("keydown", (e) => {
  const k = e.key;
  const inPanel = scene === "shop" || scene === "achievements" || scene === "album" || scene === "settings";
  if (k === "g" || k === "G") {
    if (scene === "play" || scene === "title") doUI("garden");
    else if (scene === "garden") leaveGarden();
  }
  if (k === "u" || k === "U") {
    if (scene === "play" || scene === "title") doUI("shop");
    else if (scene === "shop") scene = prevScene;
  }
  if (k === "a" || k === "A") {
    if (scene === "play" || scene === "title") doUI("ach");
    else if (scene === "achievements") scene = prevScene;
  }
  if (k === "b" || k === "B") {
    if (scene === "play" || scene === "title") doUI("album");
    else if (scene === "album") scene = prevScene;
  }
  if (k === "p" || k === "P" || k === "Escape") {
    if (scene === "play") scene = "pause";
    else if (scene === "pause") scene = "play";
    else if (scene === "whatsnew") closeWhatsNew();
    else if (scene === "away") collectAway();
    else if (scene === "mg" && mg) { if (mg.state === "result") quitMg(); else if (mg.paused) mg.paused = false; else mgPause(); }
    else if (isAdvScene(scene)) advEscape();
    else if (scene === "arcade") scene = prevScene || "title";
    else if (scene === "garden") { if (gSel) gSel = null; else leaveGarden(); }
    else if (scene === "decor") scene = "garden";
    else if (scene === "seasons") scene = "settings";
    else if (scene === "rename") { scene = "album"; hideNote(); }
    else if (isKindScene(scene)) { hideNote(); scene = prevScene || "title"; }
    else if (typeof isPartyScene === "function" && isPartyScene(scene)) partyClose();
    else if (typeof isV12Scene === "function" && isV12Scene(scene)) v12Close();
    else if (inPanel) scene = prevScene;
  }
  if ((k === "Enter" || k === " ") && scene === "whatsnew") closeWhatsNew();
  else if ((k === "Enter" || k === " ") && scene === "away") collectAway();
  if (k === "m" || k === "M") { setMusicOn(!musicOn); if (musicOn) ensureAudio(); }
  if (k === "n" || k === "N") setSfxOn(!sfxOn);
  if (LIST_SCENES[scene] && (k === "ArrowDown" || k === "ArrowUp")) {
    listScroll = clamp(listScroll + (k === "ArrowDown" ? 60 : -60), 0, listMax);
  }
});

// ===================== MAIN LOOP =====================
function updateTitle(dt) {
  spawnTimer -= dt;
  if (spawnTimer <= 0 && critters.length < 6) { spawnCritter(); spawnTimer = 1.6; }
  gloomSpawnTimer -= dt;
  if (gloomSpawnTimer <= 0 && gloomClouds.length < 2) {
    spawnGloomCloud(false);
    gloomSpawnTimer = 5;
  }
  for (const c of critters) updateCritter(c, dt);
  prune(critters, notDead);
  for (const gc of gloomClouds) {
    gc.x += gc.vx * dt * 0.5;
    if (gc.x < -80 || gc.x > W + 80) gc.dead = true;
  }
  prune(gloomClouds, notDead);
  updateParticles(dt);
  if (typeof driftPetals === "function") driftPetals(dt);
}

function stepScene(dt) {
  if (scene === "title") {
    updateTitle(dt);
    drawTitle();
    drawStoryBanner();
    if (typeof drawMorningNote === "function") drawMorningNote();
  } else if (scene === "play") {
    updatePlay(dt);
    renderPlay();
    if (typeof drawMorningNote === "function") drawMorningNote();
  } else if (scene === "shop") {
    drawShop();
  } else if (scene === "achievements") {
    drawAchievements();
  } else if (scene === "album") {
    drawAlbum();
  } else if (scene === "settings") {
    drawSettings();
  } else if (scene === "seasons") {
    drawSeasonsPanel();
  } else if (scene === "pause") {
    renderPlay();
    drawPause();
  } else if (scene === "whatsnew") {
    updateTitle(dt);
    if (wnReturn === "settings") drawSettings(); else { drawTitle(); drawStoryBanner(); }
    drawWhatsNew(dt);
  } else if (scene === "garden") {
    updateGarden(dt);
    drawGarden();
  } else if (scene === "decor") {
    drawDecor();
  } else if (scene === "arcade") {
    drawArcade();
  } else if (scene === "mg") {
    updateMg(dt);
    drawMg();
  } else if (isAdvScene(scene)) {
    advStep(dt);
    advDraw();
  } else if (isKindScene(scene)) {
    drawKindScene();
  } else if (typeof isPartyScene === "function" && isPartyScene(scene)) {
    partyStep(dt);
  } else if (typeof isV12Scene === "function" && isV12Scene(scene)) {
    v12Step(dt);
  } else if (scene === "skip" && typeof v15Step === "function") {
    v15Step(dt);
  } else if (scene === "away") {
    if (awayReturn === "title") updateTitle(dt);
    else if (awayReturn === "garden") updateGarden(dt);
    drawSceneStatic(awayReturn);
    drawAwayCard(dt);
  } else {
    scene = "title"; // unknown scene: never get stuck on a blank screen
  }
  if (postcardArm) finishPostcard();
  if (typeof boothArm !== "undefined" && boothArm) finishBoothPhoto();
  if (typeof syncNote === "function") syncNote();
  flushSave(dt);
}

const perfLog = window.__HC_DEBUG ? [] : null; // per-frame JS cost, only when debugging
function frame(ts) {
  let dt = (ts - lastTs) / 1000;
  if (!(dt > 0)) dt = 1 / 60; // first frame / clock hiccups: never NaN or negative
  dt = Math.min(0.05, dt);
  lastTs = ts;
  frameDt = dt;
  time += dt;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, W, H);
  if (window.__HC_TEST) stepScene(dt);
  else {
    const t0 = perfLog ? performance.now() : 0;
    try { stepScene(dt); } catch (err) { console.error(err); }
    if (perfLog) { perfLog.push(performance.now() - t0); if (perfLog.length > 600) perfLog.shift(); }
  }
  requestAnimationFrame(frame);
}

// ---------- while you were away ----------
function computeAway(sec, cozy, animals, rng) {
  rng = rng || Math.random;
  const s = Math.max(0, Math.min(AWAY_CAP, +sec || 0));
  if (!(cozy > 0) || s < AWAY_MIN) return null;
  const hrs = s / 3600;
  const hearts = Math.floor((15 + cozy * 4) * hrs);
  if (hearts < 1) return null;
  const visits = Math.max(1, Math.floor(hrs * Math.min(12, 2 + cozy / 15)));
  const pool = (animals || []).map(a => a.id);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  const vis = pool.slice(0, Math.min(5, visits));
  const presents = [];
  const nP = cozy >= 20 && vis.length ? Math.min(4, Math.floor(hrs / 2)) : 0;
  const cheap = DECOR.filter(d => d.cost <= 260 && !d.unlock);
  for (let i = 0; i < nP; i++) {
    const from = vis[i % vis.length];
    if (rng() < 0.5) presents.push({ from, item: cheap[Math.floor(rng() * cheap.length)].id });
    else presents.push({ from, hearts: 40 + Math.round(cozy) });
  }
  return { secs: s, hearts, visits, visitors: vis, presents };
}

// Day and night follow the player's real clock; seasons follow the calendar month (Northern Hemisphere by
// default, flippable, or picked by hand). Everything here is cosmetic plus small, friendly rewards.
const SEASONS = ["spring", "summer", "autumn", "winter"];
const SEASON_INFO = {
  spring: { name: "Spring", icon: "✿", ev: "Blossom Festival", evSub: "Tap the falling blossoms!", critter: "lamb", acc: "blossom", decor: "sakura", pill: "#ffe0ee" },
  summer: { name: "Summer", icon: "☀", ev: "Firefly Night", evSub: "Catch the glowing fireflies!", critter: "firefly", acc: "sunhat", decor: "umbrella", pill: "#eaffc8" },
  autumn: { name: "Autumn", icon: "🍂", ev: "Leaf Pile Party", evSub: "Tap the leaf piles for surprises!", critter: "fawn", acc: "acorn", decor: "pumpkin", pill: "#ffe2c0" },
  winter: { name: "Winter", icon: "❄", ev: "Snow Critters", evSub: "Tap the snow mounds to build snow pals!", critter: "seal", acc: "earmuffs", decor: "snowman", pill: "#e0f0ff" },
};
const EV_ICON = { spring: "✿", summer: "✦", autumn: "🍂", winter: "❄" };
const SEASON_GRASS = { spring: ["#8ad868", 0.15], summer: ["#5cc040", 0.3], autumn: ["#c4a448", 0.55], winter: ["#eef3fb", 0.85] };
const AUTUMN_COLS = ["#e8743a", "#c8452e", "#f0b030", "#b85a28", "#f8d070", "#d06040"];
const SEASON_EV_REWARD = 60;

function newSeasons() {
  return { mode: "auto", hemi: "N", alwaysDay: false, evWins: { spring: 0, summer: 0, autumn: 0, winter: 0 }, evYear: { spring: "", summer: "", autumn: "", winter: "" },
    fireflies: 0, nightVisits: 0, lanternNight: false, surprises: 0 };
}
let seasons = newSeasons();
function normalizeSeasons(d) {
  const o = newSeasons();
  if (!isObj(d)) return o;
  if (d.mode === "auto" || SEASONS.includes(d.mode)) o.mode = d.mode;
  if (d.hemi === "S") o.hemi = "S";
  o.alwaysDay = !!d.alwaysDay;
  for (const s of SEASONS) {
    if (isObj(d.evWins)) o.evWins[s] = Math.floor(numOr0(d.evWins[s]));
    if (isObj(d.evYear) && typeof d.evYear[s] === "string") o.evYear[s] = d.evYear[s];
  }
  o.fireflies = Math.floor(numOr0(d.fireflies)); o.nightVisits = Math.floor(numOr0(d.nightVisits)); o.surprises = Math.floor(numOr0(d.surprises));
  o.lanternNight = !!d.lanternNight;
  return o;
}

// ---------- clock (with a debug override for tests / screenshots: ?hcHour=22&hcSeason=winter) ----------
const dbgClock = { hour: null, season: null, month: null };
try {
  const q = new URLSearchParams(location.search);
  if (q.has("hcHour")) dbgClock.hour = parseFloat(q.get("hcHour"));
  if (SEASONS.includes(q.get("hcSeason"))) dbgClock.season = q.get("hcSeason");
  if (q.has("hcMonth")) dbgClock.month = parseInt(q.get("hcMonth"), 10);
} catch (e) {}
const lightCache = { k: -1, v: null };
if (window.__HC_CLOCK) setClock(window.__HC_CLOCK);
function setClock(c) {
  c = c || {};
  dbgClock.hour = typeof c.hour === "number" && isFinite(c.hour) ? ((c.hour % 24) + 24) % 24 : null;
  dbgClock.season = SEASONS.includes(c.season) ? c.season : null;
  dbgClock.month = typeof c.month === "number" && c.month >= 0 && c.month < 12 ? c.month : null;
  lightCache.k = -1;
}
function clockHour(d) {
  if (dbgClock.hour != null && isFinite(dbgClock.hour)) return dbgClock.hour;
  d = d || new Date();
  return d.getHours() + d.getMinutes() / 60;
}
function seasonForMonth(m, hemi) {
  let i = (m === 11 || m <= 1) ? 3 : m <= 4 ? 0 : m <= 7 ? 1 : 2;
  if (hemi === "S") i = (i + 2) % 4;
  return SEASONS[i];
}
function calendarSeason(d) {
  d = d || new Date();
  return seasonForMonth(dbgClock.month != null ? dbgClock.month : d.getMonth(), seasons.hemi);
}
function currentSeason(d) {
  if (dbgClock.season) return dbgClock.season;
  if (seasons.mode !== "auto") return seasons.mode;
  return calendarSeason(d);
}
// a season "instance" key, so each year's festival counts once (Dec–Feb winter belongs to the December year)
function seasonYearKey(d) {
  d = d || new Date();
  const s = currentSeason(d);
  const m = dbgClock.month != null ? dbgClock.month : d.getMonth();
  return s + "-" + (s === "winter" && m <= 1 && seasons.mode === "auto" ? d.getFullYear() - 1 : d.getFullYear());
}
const smooth01 = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
// raw light for an hour of the day: night 0..1, dawn/golden glow bumps, and a phase name
function lightAt(h) {
  const night = h < 5 ? 1 : h < 6.5 ? 1 - smooth01((h - 5) / 1.5) : h < 19.5 ? 0 : h < 21 ? smooth01((h - 19.5) / 1.5) : 1;
  const dawn = h >= 5 && h < 8 ? Math.sin(Math.PI * (h - 5) / 3) : 0;
  const golden = h >= 16.5 && h < 20.5 ? Math.sin(Math.PI * (h - 16.5) / 4) : 0;
  const phase = night > 0.5 ? "night" : h >= 5 && h < 8 ? "dawn" : h >= 17 && h < 21 ? "evening" : "day";
  return { night, dawn, golden, phase, hour: h };
}
function dayLight() {
  const k = Math.floor(time);
  if (lightCache.k === k && lightCache.v) return lightCache.v;
  const L = lightAt(clockHour());
  lightCache.v = seasons.alwaysDay ? { night: 0, dawn: 0, golden: 0, phase: "day", hour: L.hour, real: L } : Object.assign(L, { real: L });
  lightCache.k = k;
  return lightCache.v;
}
function isNight() { return dayLight().night > 0.5; }
const PHASE_NAMES = { dawn: "Dawn", day: "Daytime", evening: "Golden evening", night: "Night" };

// ---------- seasonal critters ----------
function seasonOpen(a) {
  if (!a.season) return true;
  if (currentSeason() !== a.season) return false;
  if (a.nightOnly) { const h = dayLight().real.hour; return h >= 17 || h < 6; }
  return true;
}
function seasonLockText(a) {
  const info = SEASON_INFO[a.season];
  if (currentSeason() === a.season && a.nightOnly) return "Comes out on summer evenings ☾";
  return info.icon + " Visits in " + info.name;
}

// ---------- world tint (called from worldColors) ----------
function tintWorld(o) {
  const L = dayLight(), S = currentSeason();
  const sg = SEASON_GRASS[S];
  o.grass = lerpColor(o.grass, sg[0], sg[1]);
  if (L.dawn > 0) { o.skyTop = lerpColor(o.skyTop, "#ffb4c8", L.dawn * 0.5); o.skyBot = lerpColor(o.skyBot, "#ffe4c4", L.dawn * 0.45); }
  if (L.golden > 0) {
    o.skyTop = lerpColor(o.skyTop, "#ff9e7a", L.golden * 0.5); o.skyBot = lerpColor(o.skyBot, "#ffd890", L.golden * 0.55);
    o.grass = lerpColor(o.grass, "#c8a040", L.golden * 0.15);
  }
  if (L.night > 0) {
    o.skyTop = lerpColor(o.skyTop, "#262a5e", L.night * 0.85); o.skyBot = lerpColor(o.skyBot, "#6a5a9e", L.night * 0.75);
    o.grass = lerpColor(o.grass, S === "winter" ? "#a8b4d8" : "#3e6a70", L.night * 0.5);
  }
  o.night = L.night; o.golden = L.golden; o.dawn = L.dawn; o.season = S;
  return o;
}

// ---------- sky pieces ----------
function drawMoonStars(alpha, skyTop) {
  if (alpha <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  // the moon hangs just below the HUD so it's never hidden
  const mx = W - 56, my = 96;
  ctx.fillStyle = "rgba(255,248,210,0.22)";
  ctx.beginPath(); ctx.arc(mx, my, 34, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff4c8";
  ctx.beginPath(); ctx.arc(mx, my, 20, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = skyTop;
  ctx.beginPath(); ctx.arc(mx + 9, my - 6, 16, 0, Math.PI * 2); ctx.fill();
  // sleepy moon face
  ctx.fillStyle = "#c8a860";
  ctx.fillRect(mx - 14, my, 4, 1.5); ctx.fillRect(mx - 6, my + 5, 3, 1.5);
  ctx.fillStyle = "rgba(255,150,170,0.5)"; ctx.fillRect(mx - 15, my + 5, 3, 2);
  ctx.fillStyle = "#fff8d0";
  const sh = Math.max(160, H * 0.45);
  for (let i = 0; i < 36; i++) {
    const sx = (i * 97 + 13) % W, sy = 8 + (i * 53 + 7) % sh;
    if (sx > W - 96 && sy > 56 && sy < 136) continue;
    const tw = 0.5 + 0.5 * Math.sin(time * 2 + i * 1.7);
    ctx.globalAlpha = alpha * (0.3 + tw * 0.65);
    const ss = 1 + (i % 3);
    ctx.fillRect(sx, sy, ss, ss);
    if (i % 4 === 0) { ctx.fillRect(sx - 1, sy + ss / 2 - 0.5, 1, 1); ctx.fillRect(sx + ss, sy + ss / 2 - 0.5, 1, 1); ctx.fillRect(sx + ss / 2 - 0.5, sy - 1, 1, 1); ctx.fillRect(sx + ss / 2 - 0.5, sy + ss, 1, 1); }
  }
  ctx.restore();
}

// little seasonal tree on the meadow's left hill
function drawSeasonTree(x, by, S) {
  ctx.fillStyle = "#8a5a3a"; ctx.fillRect(x - 3, by - 30, 6, 30);
  ctx.fillStyle = "#6a4028"; ctx.fillRect(x + 1, by - 30, 2, 30);
  const blob = (dx, dy, r, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + dx, by + dy, r, 0, Math.PI * 2); ctx.fill(); };
  if (S === "winter") {
    ctx.strokeStyle = "#6a4028"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x, by - 28); ctx.lineTo(x - 14, by - 46); ctx.moveTo(x, by - 30); ctx.lineTo(x + 13, by - 48);
    ctx.moveTo(x, by - 30); ctx.lineTo(x + 1, by - 54); ctx.moveTo(x - 8, by - 38); ctx.lineTo(x - 16, by - 36);
    ctx.stroke();
    ctx.fillStyle = "#ffffff";
    for (const [dx, dy, w] of [[-16, -48, 7], [10, -50, 7], [-2, -56, 6], [-19, -38, 5]]) ctx.fillRect(x + dx, by + dy, w, 3);
    return;
  }
  const pal = S === "spring" ? ["#ff9ec8", "#ffc0d8", "#ffe0ec"] : S === "summer" ? ["#4aa040", "#5cb848", "#80d060"] : ["#d8602c", "#f0a040", "#ffd060"];
  blob(0, -40, 18, pal[0]); blob(-13, -34, 12, pal[0]); blob(13, -34, 12, pal[0]);
  blob(-4, -46, 12, pal[1]); blob(8, -40, 9, pal[1]); blob(-9, -38, 7, pal[2]);
  if (S === "spring") { ctx.fillStyle = "#ffffff"; for (const [dx, dy] of [[-8, -46], [6, -50], [12, -36], [-14, -32], [2, -34]]) ctx.fillRect(x + dx, by + dy, 2, 2); }
  if (S === "summer") { ctx.fillStyle = "#ff5a6a"; for (const [dx, dy] of [[-8, -40], [8, -46], [12, -32]]) ctx.fillRect(x + dx, by + dy, 3, 3); }
}

function drawSnowdrifts() {
  const y = H - 58;
  for (let i = 0; i < 7; i++) {
    const x = (i * 61 + 14) % (W + 40) - 10, rx = 26 + (i % 3) * 8;
    ctx.fillStyle = "#d8e4f4"; ctx.beginPath(); ctx.ellipse(x, y + 3, rx, 9, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.ellipse(x - 2, y + 2, rx - 3, 7, 0, Math.PI, 0); ctx.fill();
  }
}

// flowers change with the season (the same flower objects, drawn differently)
function drawSeasonFlower(f, bloom, sway, grassCol, S, i) {
  if (S === "winter") {
    if (i % 3) return;
    const x = f.x + sway * 0.5, y = f.y;
    ctx.strokeStyle = "#5a9a5a"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(f.x, y + 8); ctx.quadraticCurveTo(x + 3, y - 6, x + 2, y - 4); ctx.stroke();
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.ellipse(x + 3, y - 1, 2.6 * f.s, 3.4 * f.s, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#b8e0a0"; ctx.fillRect(x + 2, y + 2, 2, 1);
    return;
  }
  if (S === "summer" && f.type === "tulip") {
    const x = f.x + sway, y = f.y - 8;
    ctx.strokeStyle = shade(grassCol, 10); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(f.x, f.y + 10); ctx.lineTo(x, y); ctx.stroke();
    const r = 4.2 * f.s * bloom;
    ctx.fillStyle = "#ffd23a";
    for (let p = 0; p < 8; p++) { const a = p / 8 * Math.PI * 2; ctx.beginPath(); ctx.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, 2.4 * f.s * bloom, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = "#8a5020"; ctx.beginPath(); ctx.arc(x, y, 2.8 * f.s * bloom, 0, Math.PI * 2); ctx.fill();
    return;
  }
  if (S === "autumn") {
    if (f.type === "sprout") {
      const x = f.x, y = f.y;
      ctx.fillStyle = "#fff2dc"; ctx.fillRect(x - 1.5, y - 5, 3, 6);
      ctx.fillStyle = "#e0503a"; ctx.beginPath(); ctx.ellipse(x, y - 5, 5 * f.s, 3.6 * f.s, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = "#ffffff"; ctx.fillRect(x - 3, y - 7, 1.5, 1.5); ctx.fillRect(x + 1, y - 8, 1.5, 1.5);
      return;
    }
    const k = C.flower.indexOf(f.col), col = f.col;
    f.col = AUTUMN_COLS[(k < 0 ? i : k) % AUTUMN_COLS.length];
    drawFlower(f, bloom, sway, grassCol);
    f.col = col;
    return;
  }
  drawFlower(f, bloom, sway, grassCol);
}

// ---------- weather particles (drawn behind the critters, never tappable) ----------
let wx = [], wxSeason = "", wxH = 0;
function wxTarget(S) { return S === "winter" ? 44 : S === "autumn" ? 12 : S === "spring" ? 14 : 8; }
function wxSpawn(S, anyY) {
  const p = { x: Math.random() * W, y: anyY ? Math.random() * H : -10 - Math.random() * 30, ph: Math.random() * 6, rot: Math.random() * 6,
    vr: (Math.random() - 0.5) * 3, s: 0.7 + Math.random() * 0.6, c: 0 };
  if (S === "winter") { p.vy = 18 + Math.random() * 22; p.vx = -4 + Math.random() * 8; p.s = 0.8 + Math.random() * 1.6; }
  else if (S === "autumn") { p.vy = 22 + Math.random() * 16; p.vx = 8 + Math.random() * 10; p.c = Math.floor(Math.random() * AUTUMN_COLS.length); }
  else if (S === "spring") { p.vy = 16 + Math.random() * 12; p.vx = 10 + Math.random() * 10; }
  else { p.vy = -(5 + Math.random() * 8); p.vx = -3 + Math.random() * 6; if (!anyY) p.y = H - 60 - Math.random() * 60; }
  return p;
}
function updateDrawWeather(S, dt, alpha) {
  if (wxSeason !== S || wxH !== H) { wxSeason = S; wxH = H; wx = []; for (let i = 0; i < wxTarget(S); i++) wx.push(wxSpawn(S, true)); }
  ctx.save();
  for (let i = 0; i < wx.length; i++) {
    const p = wx[i];
    p.x += (p.vx + Math.sin(time * 1.3 + p.ph) * (S === "winter" ? 8 : 14)) * dt;
    p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.x > W + 12) p.x = -10; else if (p.x < -12) p.x = W + 10;
    if (p.y > H - 24 || p.y < -60) { wx[i] = wxSpawn(S, false); continue; }
    if (S === "winter") {
      ctx.globalAlpha = alpha * 0.9; ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
    } else if (S === "autumn") {
      ctx.globalAlpha = alpha * 0.95;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(Math.cos(time * 2 + p.ph), 1);
      ctx.fillStyle = AUTUMN_COLS[p.c]; ctx.fillRect(-3.5 * p.s, -2 * p.s, 7 * p.s, 4 * p.s);
      ctx.fillStyle = "rgba(90,40,20,0.5)"; ctx.fillRect(-3.5 * p.s, -0.4, 7 * p.s, 0.9);
      ctx.restore();
    } else if (S === "spring") {
      ctx.globalAlpha = alpha * 0.9;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = i % 3 ? "#ffc0d8" : "#ffe4ee"; ctx.beginPath(); ctx.ellipse(0, 0, 3.2 * p.s, 1.9 * p.s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else {
      ctx.globalAlpha = alpha * (0.35 + 0.35 * Math.sin(time * 3 + p.ph));
      ctx.fillStyle = "#fff4a0"; ctx.fillRect(p.x, p.y, 2, 2);
    }
  }
  ctx.restore();
}

// ---------- fireflies (night, not winter): pretty everywhere, tappable in the meadow ----------
let flies = [];
function flyWanted(L, S) { return L.night > 0.35 && S !== "winter" ? (S === "summer" ? 9 : 6) : 0; }
function updateDrawFlies(dt, L, S, y0, y1) {
  const want = flyWanted(L, S);
  while (flies.length < want) flies.push({ x: 20 + Math.random() * (W - 40), y: y0 + Math.random() * (y1 - y0), a: Math.random() * 6, sp: 10 + Math.random() * 12, ph: Math.random() * 6, t: 0, cd: 0 });
  if (flies.length > want) flies.length = want;
  for (const f of flies) {
    f.t += dt; if (f.cd > 0) f.cd -= dt;
    f.a += (Math.sin(time * 0.7 + f.ph) * 1.4) * dt;
    f.x += Math.cos(f.a) * f.sp * dt; f.y += Math.sin(f.a) * f.sp * 0.6 * dt;
    if (f.x < 12 || f.x > W - 12) f.a = Math.PI - f.a;
    if (f.y < y0 || f.y > y1) f.a = -f.a;
    f.x = clamp(f.x, 10, W - 10); f.y = clamp(f.y, y0 - 2, y1 + 2);
    drawFirefly(f.x, f.y, f.ph, L.night * (f.cd > 0 ? 0.25 : 1));
  }
}
function drawFirefly(x, y, ph, a) {
  const glow = 0.55 + 0.45 * Math.sin(time * 3.2 + ph);
  // warm yellow-green glow (saturated, so it reads as a firefly rather than a grey dot)
  ctx.globalAlpha = a * glow * 0.3;
  ctx.fillStyle = "#d8ff4a";
  ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = a * glow * 0.65;
  ctx.fillStyle = "#e8ff70";
  ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = a * (0.75 + glow * 0.25);
  ctx.fillStyle = "#fbffc8"; ctx.fillRect(x - 2, y - 2, 4, 4);
  ctx.globalAlpha = 1;
}
function tapFirefly(p) {
  if (!flies.length) return false;
  for (const f of flies) {
    if (f.cd > 0) continue;
    if (dist2(p.x, p.y, f.x, f.y) < 24 * 24) {
      f.cd = 6;
      seasons.fireflies++;
      joy += 2;
      spawnSparkles(f.x, f.y, 8);
      addFloat({ x: f.x, y: f.y - 12, text: "✦ +2", life: 0.8, vy: -26, color: "#9ab020", size: 12 });
      sfxChime(seasons.fireflies);
      buzz("pet");
      checkAchievements(); saveSoon();
      return true;
    }
  }
  return false;
}

// everything seasonal in the meadow backdrop (called at the end of drawBackground)
function drawMeadowSeason(wc) {
  const S = wc.season, L = dayLight();
  if (S === "winter") drawSnowdrifts();
  updateDrawWeather(S, frameDt, 0.35 + wc.t * 0.65);
  if (scene === "title" || scene === "play" || scene === "whatsnew" || scene === "away" || scene === "pause") {
    const [y0, y1] = critterYRange();
    updateDrawFlies(scene === "pause" ? 0 : frameDt, L, S, y0 - 30, y1 + 20);
  }
  if (L.night > 0) { ctx.fillStyle = "rgba(24,26,72," + (0.16 * L.night) + ")"; ctx.fillRect(0, 0, W, H); }
  drawAdvSparkle(); // v8: the storybook's happy ending leaves a permanent sparkle
}

// ---------- seasonal meadow events ----------
function startSeasonEvent() {
  const S = currentSeason(), info = SEASON_INFO[S];
  const title = S === "summer" && !isNight() ? "Firefly Picnic!" : info.ev + "!";
  showBanner(EV_ICON[S] + " " + title, info.evSub, 2.8);
  sfxEvent();
  const ev = { type: "season", s: S, t: 0, got: 0, items: [], spawnT: 0.3, spawned: 0 };
  // piles & mounds sit on the grass just above the toolbar, clear of the daily gift and the little tree
  const gy = H - 70;
  if (S === "spring") Object.assign(ev, { dur: 20, goal: 8, max: 18 });
  else if (S === "summer") Object.assign(ev, { dur: 22, goal: 10, max: 16 });
  else if (S === "autumn") {
    Object.assign(ev, { dur: 30, goal: 4 });
    const kinds = shuffleArr(["hearts", "acorn", "critter", "sparkle"]);
    [0.09, 0.3, 0.7, 0.91].forEach((k, i) => ev.items.push({ x: W * k, y: gy, found: false, kind: kinds[i], wob: 0 }));
  } else {
    Object.assign(ev, { dur: 30, goal: 2 });
    [0.2, 0.8].forEach(k => ev.items.push({ x: W * k, y: gy - 6, stage: 0, wob: 0 }));
  }
  activeEvent = ev;
}
function updateSeasonEvent(ev, dt, wdt) {
  for (const it of ev.items) if (it.wob > 0) it.wob = Math.max(0, it.wob - dt);
  if (ev.s === "spring" || ev.s === "summer") {
    if (ev.t < ev.dur && ev.spawned < ev.max && ev.got < ev.goal) {
      ev.spawnT -= wdt;
      if (ev.spawnT <= 0) {
        ev.spawned++;
        const [y0, y1] = critterYRange();
        if (ev.s === "spring") ev.items.push({ x: 30 + Math.random() * (W - 60), y: 70, vy: 38 + Math.random() * 22, ph: Math.random() * 6, rot: 0 });
        else ev.items.push({ x: 30 + Math.random() * (W - 60), y: y0 + Math.random() * (y1 - y0), a: Math.random() * 6, ph: Math.random() * 6, life: 7 });
        ev.spawnT = ev.s === "spring" ? 0.95 : 0.8;
      }
    }
    for (const it of ev.items) {
      if (ev.s === "spring") {

function advWon(a, i) { return !!(a.gm[i] & 1); }

function advRegionOpen(a, r) { return r === 0 || advRegionDone(a, r - 1); }
function advStageOpen(a, i) { return i % 3 === 0 ? advRegionOpen(a, i / 3) : advWon(a, i - 1); }

function advGoalsMet(def, res) {
  if (!res.win) return 0;

  if (advSecondStar(def, res)) m |= 2;
  if (advThirdStar(def, res)) m |= 4;

}

function advReward(i, prevMask, mask) {

  let h = 0;
  if (!(prevMask & 1)) h += ADV_STAGES[i].finale ? 300 : 40 + r * 10;
  const newStars = popcnt3(mask & ~prevMask);
  h += newStars * 15;
  if (!h) h = 8;
  return h;
}

function advUpdate(dt) {

    if (!st.def.finale) advUpdateWorld(dt * 0.3);
  } else if (st.state === "play") {
    st.time += dt;
    if (st.hint > 0) st.hint -= dt;
    if (st.def.finale) advFinaleUpdate(dt);

      if (st.meter >= 100 && (!st.def.rescue || st.rescued)) advFinish(true);
      else if (!kind.relaxed && st.time >= st.def.dur) advFinish(false);
    }
  } else if (st.state === "result") {
    st.rt += dt;
    if (st.def.finale) advFinaleUpdate(dt);

    if (w.on > 0) { w.on -= dt; if (w.on <= 0) w.cd = 5 + Math.random() * 3; }
    else { w.cd -= dt; if (w.cd <= 0) { w.on = 2.6; w.dir = Math.random() < 0.5 ? -1 : 1; sfxAdvWind(); } }

// ---------- input + actions ----------
function advAction(id) {
  if (id === "adv_skip") { if (scene === "advcredits") creditsEnd(); else cutSkip(); return true; }
  if (id === "adv_back") { closeAdvMap(); return true; }
  if (id === "adv_close") { advSel = null; advTreasOpen = false; return true; }
  if (id === "adv_treas") { advTreasOpen = true; advSel = null; return true; }
  if (id === "adv_story_intro") { startCutscene("intro", openAdvMap); return true; }
  if (id === "adv_story_end") { startCutscene("ending", openAdvMap); return true; }
  if (id === "adv_story_lock") { toast("Befriend the Gloom King to unlock", C.textSoft); return true; }
  if (id.startsWith("adv_node_")) {
    const i = +id.slice(9);
    if (!advStageOpen(adv, i)) { const r = Math.floor(i / 3); toast(i % 3 === 0 ? "Restore " + ADV_REGIONS[r - 1].name + " first" : "Finish stage " + (i % 3) + " first", C.textSoft); sfxNope(); return true; }
    advSel = i; advTreasOpen = false; return true;
  }
  if (id === "adv_play") { const i = advSel; advSel = null; if (i != null) advStartStage(i); return true; }
  if (id === "adv_pause") { advPause(); return true; }
  if (id === "adv_resume") { if (st) st.paused = false; return true; }
  if (id === "adv_retry") { const i = st ? st.i : 0; st = null; advStartStage(i, true); return true; }
  if (id === "adv_next") { const i = st ? st.i + 1 : 0; advLeave(() => advStartStage(i)); return true; }
  if (id === "adv_map") { advLeave(openAdvMap); return true; }
  return false;
}
// a tap that didn't land on a button

// ---------- save backup codes (HC1. + base64 of the save JSON) ----------
const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
function bytesToB64(bytes) {
  let out = "";

    out += i + 1 < bytes.length ? B64[(n >> 6) & 63] : "=";
    out += i + 2 < bytes.length ? B64[n & 63] : "=";
  }
  return out;
}
function b64ToBytes(s) {

// ---------- weekly cozy challenge (deterministic from the calendar week) ----------
const WEEKLY = [
  { id: "hug30", label: "Hug 30 critters", reward: 80, field: "hugs", need: 30 },
  { id: "garden", label: "Visit the garden", reward: 60, field: "garden", need: 1 },
  { id: "arcade", label: "Play one arcade game", reward: 70, field: "arcade", need: 1 },
  { id: "shoo15", label: "Shoo 15 gloom clouds", reward: 70, field: "shoo", need: 15 },
  { id: "album", label: "Peek at your album", reward: 50, field: "album", need: 1 },
  { id: "dream", label: "Share a dream with your critters", reward: 60, field: "dream", need: 1 },

function isoWeek(d) {

}

  return new Date();
}

    kind.weekKey = c.key;
    kind.week = { hugs: 0, shoo: 0, garden: 0, arcade: 0, album: 0, dream: 0, claimed: false };
  }
  return c;
}
function weekBump(field, n, d) {

  if (kind.week.claimed) return;
  kind.week[field] = Math.min(9999, (kind.week[field] || 0) + (n || 1));
  if ((kind.week[c.def.field] || 0) >= c.def.need) {

    checkAchievements();
    save();

}

}

  if (raw.slice(0, 4) !== "HV1.") return { ok: false, error: "That isn't a friend-visit code." };

  if (typeof d.mood !== "number" || d.mood < 0 || d.mood > 100 || typeof d.hugs !== "number" || d.hugs < 0 || d.hugs > 999999) return { ok: false, error: "Those stats look jumbled." };
  const pals = [];
  for (const p of d.pals) {
    if (!p || !ANIMALS.some(a => a.id === p.id)) return { ok: false, error: "A friend in that code isn't from this meadow." };
    const name = cleanName(p.name) || palName(ANIMALS.find(a => a.id === p.id));
    pals.push({ id: p.id, name });

  return { ok: true, data: { v: 1, from: "A friend", mood: Math.round(d.mood), hugs: Math.round(d.hugs), pals } };

function normalizeV12(d) {

  o.wxUntil = typeof d.wxUntil === "number" && isFinite(d.wxUntil) ? d.wxUntil : 0;
  o.dropDay = typeof d.dropDay === "string" ? d.dropDay.slice(0, 16) : "";
  o.dropN = Math.min(40, Math.floor(numOr0(d.dropN)));
  if (isObj(d.den)) for (const id of MARKET_DEN) if (d.den[id.id]) o.den[id.id] = true;
  if (isObj(d.mail)) {

    o.mail.day = typeof m.day === "string" ? m.day.slice(0, 16) : "";
    o.mail.from = typeof m.from === "string" ? m.from.slice(0, 24) : "";
    o.mail.idx = Math.floor(numOr0(m.idx));

  o.boatDay = typeof d.boatDay === "string" ? d.boatDay.slice(0, 16) : "";
  if (isObj(d.shells)) { o.shells.spiral = !!d.shells.spiral; o.shells.pearl = !!d.shells.pearl; }
  if (isObj(d.dyes)) {
    for (const id in d.dyes) {
      if (!ANIMALS.some(a => a.id === id) || !isObj(d.dyes[id])) continue;
      const acc = Math.floor(numOr0(d.dyes[id].acc));

// ---------- weather ----------
function rollWeather() {
  if (v12.wxMode !== "auto") { v12.wx = v12.wxMode; v12.wxUntil = Date.now() + 3600000; return; }
  const S = currentSeason();
  const w = S === "winter" ? [0.12, 0.1, 0.18, 0.6]
    : S === "spring" ? [0.22, 0.48, 0.2, 0.1]
    : S === "autumn" ? [0.18, 0.22, 0.48, 0.12]
    : [0.42, 0.16, 0.36, 0.06];
  let r = skyRand(), i = 0;
  for (; i < 3; i++) { r -= w[i]; if (r <= 0) break; }
  v12.wx = ["clear", "rain", "wind", "snow"][i];
  v12.wxUntil = Date.now() + (70000 + skyRand() * 70000);
}
function ensureWeather() {
  if (v12.wxMode !== "auto") { if (v12.wx !== v12.wxMode) v12.wx = v12.wxMode; return; }
  if (!v12.wxUntil || Date.now() > v12.wxUntil) rollWeather();
}
function skyActive() { return scene === "play" || scene === "pause" || scene === "title" || scene === "garden"; }
function skyPose(c, fx) {
  if (!c || scene === "title") return 0;
  ensureWeather();
  const w = v12.wx, ph = c.phase || 0;
  if (w === "wind") fx.rot = (fx.rot || 0) + 0.16 + Math.sin(time * 2 + ph) * 0.06;
  if (w === "snow") return Math.sin(time * 16 + ph) * 1.4;
  if (w === "rain" && c.x < 92) fx.rot = (fx.rot || 0) - 0.08;
  return 0;
}
function skySpawnBit(front) {
  const w = v12.wx;
  return {
    x: skyRand() * W, y: front ? 40 + skyRand() * (H - 140) : -8,
    vy: w === "snow" ? 16 + skyRand() * 18 : w === "wind" ? 10 + skyRand() * 20 : 70 + skyRand() * 50,
    vx: w === "wind" ? 40 + skyRand() * 30 : w === "rain" ? -8 : (skyRand() - 0.5) * 10,
    s: 0.7 + skyRand() * 0.8, ph: skyRand() * 6,
    tap: front && (w === "rain" || w === "snow"),
  };
}
function skyStep(dt) {
  if (!skyActive()) return;
  ensureWeather();
  const w = v12.wx;
  const want = w === "clear" ? 0 : (scene === "garden" ? 10 : 22);
  while (skyBits.length < want) skyBits.push(skySpawnBit(false));
  if (skyBits.length > want) skyBits.length = want;
  const tapsWant = (scene === "play" && (w === "rain" || w === "snow") && !tut) ? 4 : 0;
  while (skyTaps.length < tapsWant) skyTaps.push(skySpawnBit(true));
  if (skyTaps.length > tapsWant) skyTaps.length = tapsWant;
  const move = (p) => {
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (w === "wind") p.x += Math.sin(time + p.ph) * 8 * dt;
    if (p.y > H - 20 || p.x > W + 20 || p.x < -20) Object.assign(p, skySpawnBit(p.tap));
  };
  for (const p of skyBits) move(p);
  for (const p of skyTaps) move(p);
}
function drawSkyBits(list, light) {

let skip = null;
function openSkip() {

  skip = {
    pads: pads,
    i: 0,
    hops: 0,
    done: false,

function skipPay(n) {
