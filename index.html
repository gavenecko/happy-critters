    try { buildAudioGraph(); } catch (e) { A = null; }
  }

  // later gestures until the context is really running (pointerdown alone doesn't count on iOS,
  // and returning from the background can leave the context "interrupted").
  if (A && (!audioUnlocked || audioCtx.state !== "running")) {

      const b = audioCtx.createBuffer(1, 1, 22050);
      const s = audioCtx.createBufferSource();
      s.buffer = b; s.connect(audioCtx.destination);
      s.start(0); s.stop(audioCtx.currentTime + 0.01);
    } catch (e) {}

}

function makePulseWave(duty) {

function buildAudioGraph() {

    } catch (e) {}

  A.musicGain = ac.createGain();
  A.musicGain.gain.value = musicOn ? MUSIC_VOL : 0;
  A.musicGain.connect(A.master);
  A.musicFilter = ac.createBiquadFilter();
  A.musicFilter.type = "lowpass";
  A.musicFilter.frequency.value = 3200;
  A.musicFilter.Q.value = 0.5;
  A.musicFilter.connect(A.musicGain);
  A.musicBus = ac.createGain();
  A.musicBus.gain.value = 1;
  A.musicBus.connect(A.musicFilter);

  A.echoDelay.connect(A.echoFb); A.echoFb.connect(A.echoDelay);
  A.echoDelay.connect(A.echoWet); A.echoWet.connect(A.musicFilter);
  A.melodyBus = ac.createGain();
  A.melodyBus.gain.value = 1;
  A.melodyBus.connect(A.musicBus);
  A.melodyBus.connect(A.echoDelay);

  A.sfxGain = ac.createGain();
  A.sfxGain.gain.value = sfxOn ? SFX_VOL : 0;
  A.sfxGain.connect(A.master);
  A.sfxBus = ac.createBiquadFilter();
  A.sfxBus.type = "lowpass";
  A.sfxBus.frequency.value = 5200;
  A.sfxBus.connect(A.sfxGain);

  const len = Math.floor(ac.sampleRate || 44100);
  A.noise = ac.createBuffer(1, len, ac.sampleRate || 44100);
  const ch = A.noise.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;

function tone(dest, wave, freq, t, dur, vol, env) {

  const d = env.d != null ? env.d : 0.09;
  const s = env.s != null ? env.s : 0.55;

  g.gain.setValueAtTime(0.0001, t);

  g.gain.exponentialRampToValueAtTime(sus, decEnd);
  if (holdEnd > decEnd) g.gain.setValueAtTime(sus, holdEnd);
  g.gain.exponentialRampToValueAtTime(0.0001, holdEnd + r);

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(dest);
  src.start(t, Math.random() * 0.5);
  src.stop(t + dur + 0.02);

  timer: null, nextTime: 0, step: 0, formIdx: 0, songIdx: 0, tier: 0, bpm: 100,
  stats: { melody: 0, bass: 0, drums: 0, arp: 0, harmony: 0, sparkle: 0, tierChanges: 0, bars: 0 },
};

function rawTier(m) { return m >= 100 ? 4 : m >= 75 ? 3 : m >= 50 ? 2 : m >= 25 ? 1 : 0; }
function targetTier() {
  let t = rawTier(mood);
  const cur = music.tier;
  if (t < cur && cur < 4 && mood > TIER_AT[cur] - 3) t = cur; // small hysteresis going down
  return t;
}
function tierBpm(song, tier) { return song.bpm * (tier === 0 ? 0.86 : tier === 4 ? 1.05 : 1); }
function stepDur() { return 60 / music.bpm / 4; }

function startMusicScheduler() {
  if (!audioCtx || !A || music.timer) return;
  music.tier = rawTier(mood);
  music.bpm = tierBpm(SONGS[music.songIdx], music.tier);
  music.nextTime = audioCtx.currentTime + 0.1;
  music.timer = setInterval(musicTick, TICK_MS);
}

function musicTick() {
  if (!audioCtx || !A || audioCtx.state !== "running") return;
  const now = audioCtx.currentTime;
  if (music.nextTime < now - 0.2) {
    // we were suspended / throttled: resync on the next bar instead of bursting notes
    music.nextTime = now + 0.06;
    music.step = Math.ceil(music.step / 16) * 16;
    if (music.step >= 128) advanceSection();
  }
  let guard = 0;
  while (music.nextTime < now + LOOKAHEAD && guard++ < 64) {
    scheduleStep(music.nextTime);
    music.nextTime += stepDur();
    music.step++;
    if (music.step >= 128) advanceSection();
  }
}
function advanceSection() {
  music.step = 0;
  music.formIdx++;
  const song = SONGS[music.songIdx];
  if (music.formIdx >= song.form.length) {
    music.formIdx = 0;
    music.songIdx = (music.songIdx + 1) % SONGS.length;
  }
}

function scheduleStep(t) {
  const song = SONGS[music.songIdx];
  const secName = song.form[music.formIdx];
  const sec = song.compiled[secName];
  const s = music.step;
  const inBar = s % 16;
  if (inBar === 0) {
    // layer / tempo changes only happen on bar boundaries
    const nt = targetTier();
    if (nt !== music.tier) { music.tier = nt; music.stats.tierChanges++; }
    music.bpm = tierBpm(song, music.tier);
    music.stats.bars++;
  }
  if (!musicOn) return;
  const tier = music.tier;
  const sd = stepDur();
  const ch = sec.chords[s];
  const secondPass = music.formIdx >= 2;
  const M = A.melodyBus, B = A.musicBus;

  // --- melody ---
  const n = sec.mel[s];
  if (n) {
    const sparse = tier === 0 && inBar % 4 !== 0 && n.len <= 2;
    if (!sparse) {
      let midi = tier === 0 ? minorize(n.midi, song.key) : n.midi;
      const dur = n.len * sd * (tier === 0 ? 0.95 : 0.8);
      const f = mtof(midi);
      if (tier === 0) {
        tone(M, "triangle", f, t, dur, 0.15, { a: 0.03, d: 0.25, s: 0.45, r: 0.3 });
      } else {
        tone(M, A.pulse25, f, t, dur, 0.1, { a: 0.006, d: 0.1, s: 0.5, r: 0.08 });
        tone(M, "triangle", f, t, dur, 0.06, { a: 0.006, d: 0.12, s: 0.5, r: 0.1 });
      }
      music.stats.melody++;
      if (tier >= 3 && n.len >= 4 && ch) {
        // soft harmony: nearest chord tone a third-ish below the melody
        const tones = chordTones(ch, 4).concat(chordTones(ch, 3));
        let h = null;
        for (const c of tones) if (c < midi - 2 && c >= midi - 9 && (h == null || c > h)) h = c;
        if (h != null) {
          tone(B, "triangle", mtof(h), t, dur, 0.055, { a: 0.02, d: 0.15, s: 0.6, r: 0.12 });
          music.stats.harmony++;
        }
      }
    }
  }
  // celebratory sparkle (100%): octave-up echo one 16th after each melody note
  const prev = s > 0 ? sec.mel[s - 1] : null;
  if (tier === 4 && prev) {
    tone(B, "sine", mtof(prev.midi) * 2, t, Math.min(prev.len, 2) * sd, 0.035, { a: 0.004, d: 0.08, s: 0.3, r: 0.1 });
    music.stats.sparkle++;
  }

  // --- bass (25%+) ---
  if (tier >= 1 && ch) {
    const root = 36 + ch.root; // C2..B2; played an octave up (C3 range) so phone speakers can carry it
    let pat;
    if (tier === 1) pat = { 0: [0, 6], 8: [7, 5] };
    else if (tier < 4) pat = { 0: [0, 3], 6: [7, 2], 8: [0, 3], 12: [12, 2], 14: [7, 2] };
    else pat = { 0: [0, 2], 2: [12, 2], 4: [7, 2], 6: [12, 2], 8: [0, 2], 10: [12, 2], 12: [7, 2], 14: [4 + (ch.minor ? -1 : 0), 2] };
    const p = pat[inBar];
    if (p) {
      tone(B, "triangle", mtof(root + 12 + p[0]), t, p[1] * sd * 0.85, 0.22, { a: 0.006, d: 0.12, s: 0.6, r: 0.07 });
      music.stats.bass++;
    }
  }

  // --- percussion (50%+) ---
  if (tier >= 2) {
    const kickOn = inBar === 0 || inBar === 8 || (tier >= 3 && inBar === 10 && secondPass);
    if (kickOn) {
      tone(B, "sine", 130, t, 0.02, 0.28, { a: 0.003, d: 0.08, s: 0.3, r: 0.1, slideTo: 45, slideT: 0.12 });
      music.stats.drums++;
    }
    const hatOn = tier === 2 ? (inBar % 4 === 2) : (inBar % 2 === 0 && inBar % 8 !== 0) || (tier === 4 && inBar % 2 === 1);
    if (hatOn) {
      const v = inBar % 4 === 2 ? 0.07 : 0.035;
      noiseHit(B, t, 0.035, v, "highpass", 7500, 0.7);
      music.stats.drums++;
    }
    if (tier === 4 && (inBar === 4 || inBar === 12)) {
      noiseHit(B, t, 0.09, 0.08, "bandpass", 1800, 1.2, 1100); // soft clap
      music.stats.drums++;
    }
  }

  // --- arpeggio (75%+) ---
  if (tier >= 3 && ch && inBar % 2 === 0) {
    const tones = chordTones(ch, 5);
    const order = [0, 1, 2, 3, 2, 1, 0, 2];
    const m = tones[order[(inBar / 2) % 8]];
    tone(B, A.pulse12, mtof(m), t, sd * 0.9, tier === 4 ? 0.045 : 0.035, { a: 0.004, d: 0.06, s: 0.3, r: 0.06 });
    music.stats.arp++;
  }
}

function updateMusic() {
  // Layers follow the mood on the next bar boundary; just make sure the scheduler runs.
  if (audioCtx && A && !music.timer) startMusicScheduler();
}

document.addEventListener("visibilitychange", () => {
  if (!audioCtx) return;
  if (document.hidden) {
    try { audioCtx.suspend(); } catch (e) {}
    save();

});

// ===================== LAYOUT =====================
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const [vw, vh] = viewportSize();
  const m = vw < 520 ? 4 : 16;
  const availW = Math.max(200, Math.min(vw - m, 900)), availH = Math.max(300, vh - m);
  // Keep a 360-wide logical canvas, but grow taller on portrait phones so nothing is letterboxed.
  const newH = Math.round(Math.max(540, Math.min(740, W * availH / availW)));
  if (newH !== H) { H = newH; initDecor(); listScroll = 0; }
  let cw = availW, ch = cw * H / W;
  if (ch > availH) { ch = availH; cw = ch * W / H; }
  canvas.style.width = cw + "px";
  canvas.style.height = ch + "px";
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);

function viewportSize() {
  let vw = window.innerWidth, vh = window.innerHeight;
  const wrap = document.getElementById("wrap");
  if (wrap && wrap !== canvas && window.getComputedStyle && wrap.clientWidth > 0) {
    const cs = window.getComputedStyle(wrap);
    const px = k => parseFloat(cs[k]) || 0;
    vw = wrap.clientWidth - px("paddingLeft") - px("paddingRight");
    vh = wrap.clientHeight - px("paddingTop") - px("paddingBottom");
  }
  return [vw, vh];
}

const fontCache = new Map();
function font(px, bold) {
  const k = bold ? -px : px;
  let f = fontCache.get(k);
  if (!f) { f = (bold ? "bold " : "") + px + 'px "Segoe UI", system-ui, sans-serif'; if (fontCache.size < 300) fontCache.set(k, f); }
  ctx.font = f;
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// ===================== SPRITES =====================
const spriteCache = new Map();

function pickFrame(animal, sad, phaseSeed, forceBlink) {
  const frames = SPRITE_FRAMES[animal.id];
  if (!frames) return null;
  if (forceBlink) return sad ? frames.sadBlink : frames.blink;
  // Blink ~12% of a 2.4s cycle; ear twitch brief on another slice
  const t = (time * 1000 + (phaseSeed || 0) * 137) % 2400;
  const blinking = t > 2100 && t < 2220;
  const earing = !blinking && t > 900 && t < 980;
  if (sad) return blinking ? frames.sadBlink : frames.sad;
  if (blinking) return frames.blink;
  if (earing && frames.ear) return frames.ear;
  return frames.idle;
}

function colorForPixel(idx, animal, shiny, sad) {
  let col = PAL[idx];
  if (!col) return null;
  if (animal.id === "rainbow") {
    if (idx !== 1 && idx !== 17 && idx !== 18 && idx !== 16 && idx !== 19 && idx !== 2 && idx !== 20) {
      const hue = (time * 50 + idx * 40) % 360;
      col = "hsl(" + hue + ",78%,62%)";
    } else if (idx === 2) {
      col = "#fff8f2";
    }
  }
  if (shiny) {
    if (idx === 1) col = "#806020";
    else if (idx === 18) col = "#3a2810";
    else if (idx === 17) col = "#fff8e0";
    else if (idx === 16) col = "#ffc080";
    else if (idx === 2 || idx === 14) col = "#fff8c0";
    else if (idx === 19) col = "#e07030";
    else if (idx === 20) col = "#80d0ff";
    else col = "hsl(" + (38 + (idx % 5) * 4) + ",85%," + (45 + (idx % 7) * 4) + "%)";
  }
  if (sad && !shiny) {
    if (idx === 2) col = "#eef2f8";
    else if (idx === 3 || idx === 4) col = "#c8d0e0";
    else if (idx === 5 || idx === 6 || idx === 7 || idx === 24 || idx === 25) col = "#a0a8b8";
    else if (idx === 9 || idx === 22) col = "#d0d8e0";
    else if (idx === 12 || idx === 13 || idx === 30) col = "#88a090";
    else if (idx === 27 || idx === 28) col = "#787060";
    else if (idx === 16) col = "#a8b8c8";
    else if (idx === 29) col = "#b0a0b8";
    else if (idx === 31) col = "#a89ca0";
    else if (idx === 32) col = "#605860";
    else if (idx === 33 || idx === 34) col = "#c8c0b0";
  }
  return col;
}

function getSpriteCanvas(animal, shiny, sad, phaseSeed, forceBlink) {
  const frames = SPRITE_FRAMES[animal.id];
  if (!frames) return null;
  const grid = pickFrame(animal, sad, phaseSeed, forceBlink);
  const frameKey = grid === frames.blink ? "b" : grid === frames.ear ? "e" : grid === frames.sad ? "d" : grid === frames.sadBlink ? "db" : "i";
  const rainKey = animal.id === "rainbow" ? "_" + Math.floor(time * 6) : "";
  const key = animal.id + (shiny ? "_s" : "") + "_" + frameKey + rainKey;
  if (spriteCache.has(key)) return spriteCache.get(key);

  const off = document.createElement("canvas");
  off.width = SPRITE_SIZE;
  off.height = SPRITE_SIZE;
  const octx = off.getContext("2d");
  for (let y = 0; y < SPRITE_SIZE; y++) {
    for (let x = 0; x < SPRITE_SIZE; x++) {
      const idx = grid[y][x];
      if (!idx) continue;
      let col = colorForPixel(idx, animal, shiny, sad);
      if (!col) continue;
      if (animal.id === "rainbow" && idx !== 1 && idx !== 17 && idx !== 18 && idx !== 16 && idx !== 19 && idx !== 2 && idx !== 20) {
        const hue = ((x + y) * 14 + time * 55) % 360;
        col = "hsl(" + hue + ",80%,60%)";
      }
      octx.fillStyle = col;
      octx.fillRect(x, y, 1, 1);
    }
  }
  if (shiny) {
    octx.fillStyle = "#fff8c0";
    const spark = [[3, 4], [SPRITE_SIZE - 4, 6], [5, SPRITE_SIZE - 5], [SPRITE_SIZE - 6, SPRITE_SIZE - 7]];
    for (const [sx, sy] of spark) {
      if (Math.sin(time * 9 + sx + sy) > 0.2) octx.fillRect(sx, sy, 1, 1);
    }
  }
  spriteCache.set(key, off);
  if (spriteCache.size > 160) {
    const first = spriteCache.keys().next().value;
    spriteCache.delete(first);
  }
  return off;
}

// Pixel pattern drawer in sprite units, with optional auto 1px outline
const OUTLINE = "#2c2030";
const NEIGH4 = [[-1, 0], [1, 0], [0, -1], [0, 1]];
function drawPattern(rows, cmap, sx, sy, ox, oy, u, outline, g) {
  g = g || ctx;
  const pad = g === ctx ? 0.3 : 0; // on the main canvas overlap slightly to hide seams; offscreen stays exact
  sx = Math.round(sx); sy = Math.round(sy);
  const filled = (x, y) => y >= 0 && y < rows.length && x >= 0 && x < rows[y].length && rows[y][x] !== ".";
  if (outline) {
    g.fillStyle = OUTLINE;
    for (let y = 0; y < rows.length; y++) for (let x = 0; x < rows[y].length; x++) {
      if (!filled(x, y)) continue;
      for (const d of NEIGH4) {
        if (!filled(x + d[0], y + d[1])) g.fillRect(ox + (sx + x + d[0]) * u, oy + (sy + y + d[1]) * u, u + pad, u + pad);
      }
    }
  }
  for (let y = 0; y < rows.length; y++) for (let x = 0; x < rows[y].length; x++) {
    const ch = rows[y][x];
    if (ch === ".") continue;
    g.fillStyle = cmap[ch] || "#fff";
    g.fillRect(ox + (sx + x) * u, oy + (sy + y) * u, u + pad, u + pad);
  }
}

const ACC_PAD = 8;
const accCache = new Map();
function drawAccessory(accId, animalId, ox, oy, u) {
  const key = accId + "|" + animalId;

  if (off === undefined) {
    off = null;
    try {
      off = document.createElement("canvas");
      off.width = off.height = SPRITE_SIZE + ACC_PAD * 2;
      const g = off.getContext("2d");
      if (!g) off = null; else drawAccessoryTo(g, accId, animalId, ACC_PAD, ACC_PAD, 1);
    } catch (e) { off = null; }
    accCache.set(key, off);
  }
  if (!off) { drawAccessoryTo(ctx, accId, animalId, ox, oy, u); return; }
  const a = ctx.globalAlpha;
  if (accId === "halo") ctx.globalAlpha = a * (0.75 + Math.sin(time * 4) * 0.25);
  ctx.drawImage(off, ox - ACC_PAD * u, oy - ACC_PAD * u, off.width * u, off.height * u);
  ctx.globalAlpha = a;
}
function drawAccessoryTo(g, accId, animalId, ox, oy, u) {
  const [hx, top, ey, edx, ny] = ANCHOR[animalId] || ANCHOR.cat;
  if (accId === "shades") {
    const l = Math.round(hx - edx - 2), r = Math.round(hx + edx - 2), y0 = Math.round(ey - 1);
    const w = r + 5 - l;
    const rows = [];
    for (let y = 0; y < 3; y++) {
      let row = "";
      for (let x = 0; x < w; x++) {
        const ax = l + x;
        const inL = ax >= l && ax < l + 5, inR = ax >= r && ax < r + 5;
        const lens = (inL || inR) && !(y === 2 && (ax === l || ax === l + 4 || ax === r || ax === r + 4));
        const bridge = y === 0 && !inL && !inR;
        row += lens ? ((y === 0 && (ax === l + 1 || ax === r + 1)) ? "h" : "d") : bridge ? "d" : ".";
      }
      rows.push(row);
    }
    drawPattern(rows, { d: "#1a1520", h: "#a0a8d0" }, l, y0, ox, oy, u, false, g);
    return;
  }
  if (accId === "scarf") {
    const rows = ["aaaaaaaaaaa", "abaabaabaab", "......aa...", "......ab...", "......aa..."];
    drawPattern(rows, { a: "#ff5a6a", b: "#fff0d0" }, hx - 5.5, ny - 1, ox, oy, u, true, g);
    return;
  }
  if (accId === "halo") {
    drawPattern([".aaaaa.", "a.....a", ".aaaaa."], { a: "#fff27a" }, hx - 3.5, top - 6, ox, oy, u, false, g);
    return;
  }
  const art = ACC_ART[accId];
  if (!art) return;
  const [sx, sy] = art.at(hx, top);
  drawPattern(art.rows, art.cmap, sx, sy, ox, oy, u, true, g);
}

function drawHeartEyes(animalId, ox, oy, u) {
  const [hx, , ey, edx] = ANCHOR[animalId] || ANCHOR.cat;
  const rows = ["aa.aa", "aaaaa", ".aaa.", "..a.."];
  const cm = { a: "#ff4f8b" };
  drawPattern(rows, cm, hx - edx - 2.5, ey - 1.5, ox, oy, u, false);
  drawPattern(rows, cm, hx + edx - 2.5, ey - 1.5, ox, oy, u, false);
}

function drawZzz(animalId, ox, oy, u) {
  const [hx, top] = ANCHOR[animalId] || ANCHOR.cat;
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let k = 0; k < 3; k++) {
    const ph = (time * 0.55 + k / 3) % 1;
    ctx.globalAlpha = Math.max(0, 1 - ph) * 0.9;
    font(Math.round((4 + ph * 4) * u), true);
    ctx.fillStyle = "#6070a8";
    ctx.fillText("z", ox + (hx + 6 + ph * 5) * u, oy + (top - 1 - ph * 9) * u);
  }
  ctx.restore();
}

function accAvailable(id, animalId) {
  const a = ACCESSORIES.find(x => x.id === id);
  if (!a) return false;
  if (a.cost) return !!ownedAcc[a.id];
  return (friendLvl[animalId] || 0) >= a.friend;
}
function accOptions(animalId) { return ACCESSORIES.filter(a => accAvailable(a.id, animalId)); }
function equippedFor(animalId) {
  const e = equipped[animalId];
  return e && accAvailable(e, animalId) ? e : null;
}

// fx: { acc, heartEyes, rot, nap, sq }  (sq > 0 = squash wide, < 0 = stretch tall)
function drawSprite(animal, x, y, scale, shiny, bounce, sad, phaseSeed, fx) {
  const spr = getSpriteCanvas(animal, shiny, sad, phaseSeed == null ? x * 10 + y : phaseSeed, fx && fx.nap);
  if (!spr) return;
  const s = scale * SPRITE_SIZE;
  const by = bounce || 0;
  ctx.imageSmoothingEnabled = false;
  const baseA = ctx.globalAlpha;
  ctx.globalAlpha = baseA * 0.16;
  ctx.fillStyle = "#2a2030";
  ctx.beginPath();
  ctx.ellipse(x, y + s * 0.42 + 2, s * 0.32, s * 0.09, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = baseA;
  ctx.save();
  ctx.translate(x, y + by);
  if (fx && fx.rot) ctx.rotate(fx.rot);
  if (fx && fx.flip) ctx.scale(-1, 1);
  if (fx && fx.sq) {
    const foot = s * 0.42;
    ctx.translate(0, foot);
    ctx.scale(1 + fx.sq, 1 - fx.sq * 0.9);
    ctx.translate(0, -foot);
  }
  ctx.drawImage(spr, -s / 2, -s / 2, s, s);
  if (fx) {
    const u = s / SPRITE_SIZE;
    if (fx.acc) drawAccessory(fx.acc, animal.id, -s / 2, -s / 2, u);
    if (fx.heartEyes && !sad && !fx.nap) drawHeartEyes(animal.id, -s / 2, -s / 2, u);
    if (fx.nap) drawZzz(animal.id, -s / 2, -s / 2, u);
  }
  ctx.restore();
  if (shiny) {
    const tw = Math.sin(time * 8 + x) * 0.5 + 0.5;
    ctx.globalAlpha = baseA * (0.35 + tw * 0.45);
    ctx.strokeStyle = "#ffd700";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y + by, s * 0.48, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = "#fffef0";
    ctx.fillRect(x - s * 0.18, y - s * 0.38 + by, 2, 2);
    ctx.fillRect(x + s * 0.22, y - s * 0.12 + by, 2, 2);
    ctx.fillRect(x + s * 0.05, y + s * 0.28 + by, 1, 1);
    ctx.globalAlpha = baseA;
  }
  if (animal.id === "rainbow") {
    ctx.globalAlpha = baseA * (0.28 + Math.sin(time * 6) * 0.18);
    const g = ctx.createLinearGradient(x - s * 0.5, y, x + s * 0.5, y);
    g.addColorStop(0, "#ff6b9d");
    g.addColorStop(0.33, "#ffe566");
    g.addColorStop(0.66, "#7dcea0");
    g.addColorStop(1, "#5dade2");
    ctx.strokeStyle = g;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y + by, s * 0.52, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = baseA;
  }
}

// ===================== CORE GAME =====================
function unlockedList() {
  return ANIMALS.filter(a => unlocked[a.id]);
}

function addMood(amt) {
  const prev = mood;
  mood = Math.max(0, Math.min(100, mood + amt));
  if (mood > moodPeak) moodPeak = mood;
  if (mood > prev) {
    joyStreak++;
    if (joyStreak > highJoyStreak) highJoyStreak = joyStreak;
  }
  checkStory(prev, mood);
  if (mood >= 100 && !victoryDone) triggerVictory();
  updateMusic();
}

function checkStory(prev, cur) {
  for (const s of STORY) {
    if (s.at === 0) continue;
    if (prev < s.at && cur >= s.at && !storySeen[s.at]) {
      storySeen[s.at] = true;
      if (s.at !== 100) { showStory(s.title, s.sub); sfxUnlock(); buzz("unlock"); }
    }
  }
}

function showBanner(title, sub, life) {
  const b = { title, sub, life: life || 3.0, max: life || 3.0, fit: null };
  if (!storyBanner) storyBanner = b;
  else if (bannerQueue.length < 4) bannerQueue.push(b);
}
function showStory(title, sub) { showBanner(title, sub, 3.6); }

// Toasts: at most 3 on screen in tidy slots; extras wait their turn instead of piling up.
const toastQueue = [];
function toast(text, color) {
  if (toastQueue.length < 12) toastQueue.push([text, color]);
  pumpToasts();
}
function pumpToasts() {
  while (toastQueue.length) {
    let used = 0;
    for (const f of floatTexts) if (f.toast && f.life > 0) used |= 1 << f.slot;
    let slot = -1;
    for (let i = 0; i < 3; i++) if (!(used & (1 << i))) { slot = i; break; }
    if (slot < 0) return;
    const [text, color] = toastQueue.shift();
    addFloat({ x: W / 2, y: 106 + slot * 24, text, life: 2.2, vy: 0, color: color || "#7a40a0", size: 12, toast: true, slot });
  }
}

function triggerVictory() {
  victoryDone = true;
  sfxVictory();
  showBanner("Joy cured the day!", "Confetti rains. Critters dance!", 3.6);
  spawnConfetti(80);
  screenPulse = 1;
  popFx(W / 2, H * 0.45, "#ffe080", 1.6);
  buzz("friend");
  if (!unlocked.rainbow) {
    unlocked.rainbow = true;
    addFloat({ x: W / 2, y: H / 2 - 40, text: "✦ Rainbow Critter unlocked!", life: 3.5, vy: -18, color: C.gold, size: 15 });
  }
  if (!unlockedBgs.bloom) unlockedBgs.bloom = true;
  bgId = "bloom";
  checkAchievements();
  save();
}

function newDawn() {
  mood = 5 + Math.min(15, dawnCount * 2);
  victoryDone = false;
  storySeen = {};
  dawnCount++;
  gloomClouds = [];
  confetti = [];
  activeEvent = null;
  showBanner("A New Dawn…", "The meadow waits. Keep your friends.", 3.2);
  sfxUnlock();
  if (unlockedBgs.misty) bgId = "misty";
  save();
}

function critterYRange() { return [130, Math.max(260, H - 170)]; }

function makeCritter(animal, opts) {
  opts = opts || {};
  const shiny = !!opts.shiny, sad = !!opts.sad;
  const scale = opts.scale || 1.6;
  return {
    id: ++critterSeq, animal, shiny, sad,
    x: opts.x, y: opts.y, baseY: opts.y, vx: opts.vx,
    phase: opts.phase != null ? opts.phase : Math.random() * Math.PI * 2,
    bobAmp: opts.bobAmp != null ? opts.bobAmp : (sad ? 3 + Math.random() * 4 : 6 + Math.random() * 8),
    scale, state: "float", stateT: 0, hugScale: 1,
    life: opts.life != null ? opts.life : 11 + Math.random() * 9,
    dancing: false, parade: !!opts.parade,
    hugs: 0, pets: 0, heartEyesT: 0, spinT: 0, stay: false,
    idle: null, idleDur: 0, idleT: 5 + Math.random() * 9,
    sqT: 9, sqAmp: 0,
  };
}

function spawnCritter() {
  const list = unlockedList();
  if (!list.length || critters.filter(c => !c.parade).length >= MAX_CRITTERS) return;
  const animal = list[Math.floor(Math.random() * list.length)];
  const shiny = animal.id !== "rainbow" && Math.random() < 0.045;
  const sadChance = 0.12 + (1 - mood / 100) * 0.28;
  const sad = !shiny && animal.id !== "rainbow" && Math.random() < sadChance;
  const fromLeft = Math.random() < 0.5;
  const scale = shiny || animal.id === "rainbow" ? 2.05 + Math.random() * 0.35 : 1.55 + Math.random() * 0.5;
  const [y0, y1] = critterYRange();
  let y = y0 + Math.random() * (y1 - y0);
  for (let attempt = 0; attempt < 8; attempt++) {
    const candidate = y0 + Math.random() * (y1 - y0);
    if (critters.every(o => Math.abs(o.baseY - candidate) > 48)) { y = candidate; break; }
  }
  const speed = (0.55 + Math.random() * 0.85) * (shiny ? 1.25 : 1) * (sad ? 0.75 : 1) * (fromLeft ? 1 : -1);
  const half = scale * SPRITE_SIZE * 0.5;
  critters.push(makeCritter(animal, {
    shiny, sad, scale, y,
    x: fromLeft ? -half - 4 : W + half + 4,
    vx: speed * 42,
  }));
}

function friendLevelFor(n) { let l = 0; for (const m of FRIEND_MILESTONES) if (n >= m) l++; return l; }

function checkFriendship(animal) {
  const id = animal.id;
  const nl = friendLevelFor(critterHugs[id] || 0);
  const ol = friendLvl[id] || 0;
  if (nl <= ol) return;
  friendLvl[id] = nl;
  const reward = ACCESSORIES.find(a => a.friend === nl);
  const hearts = 25 * nl;
  joy += hearts;
  addMood(0.5 + nl * 0.25);
  if (reward && !equippedFor(id)) equipped[id] = reward.id;
  albumNew = true;
  levelUpFx = { animal, lvl: nl, reward, hearts, t: 0, dur: 2.8 };
  sfxFriend();
  buzz("friend");
  spawnConfetti(28);
  screenPulse = Math.max(screenPulse, 0.6);
}

const JOY_PACE = 0.84; // global Joy-per-hug pacing (tuned with test/balance.mjs)
function hugCritter(c, moodScale) {
  if (c.state !== "float") return;
  const wasSad = c.sad;
  const wasNapping = c.idle === "nap";
  c.idle = null; c.idleT = 6 + Math.random() * 8;
  c.state = "happy";
  c.stateT = 0;
  c.hugScale = 1.12;
  c.sqT = 0; c.sqAmp = wasSad || c.shiny ? 0.34 : 0.27;
  c.sad = false;
  c.dancing = mood >= 100;
  c.hugs++;
  if (c.hugs >= 2) c.heartEyesT = 1.6;
  if (c.hugs >= 3) { c.spinT = 0.6; sfxSpin(); }

  if (comboTimer > 0) combo++;
  else combo = 1;
  comboTimer = COMBO_WINDOW;
  if (combo > highCombo) highCombo = combo;

  const mult = Math.min(combo, 30);
  let pts = (c.shiny ? 25 : c.animal.id === "rainbow" ? 40 : 5) * mult;
  if (c.shiny) pts = Math.floor(pts * 1.5);
  if (wasSad) pts = Math.floor(pts * 2.2);
  const golden = activeEvent && activeEvent.type === "golden";
  if (golden) pts *= 2;
  joy += pts;
  scoreSession += pts;
  if (scoreSession > highScore) highScore = scoreSession;
  totalHugs++;
  critterHugs[c.animal.id] = (critterHugs[c.animal.id] || 0) + 1;

  // Tuned so ~1 hug/sec with a few clouds reaches ~25% in 30–60s and ~100% in 5–8 min
  let moodGain = 0.36 + Math.min(mult, 10) * 0.018;
  if (c.shiny) moodGain *= 1.4;
  if (wasSad) moodGain *= 1.65;
  if (c.animal.id === "rainbow") moodGain *= 1.5;
  moodGain *= Math.max(0.42, 1.08 - mood * 0.0065);
  addMood(moodGain * JOY_PACE * (moodScale == null ? 1 : moodScale));

  if (c.parade && activeEvent && activeEvent.type === "parade") activeEvent.hugged++;

  if (wasNapping) {
    stats.naps++;
    sfxWake();
    addFloat({ x: c.x, y: c.y - 58, text: "Good morning!", life: 1.2, vy: -24, color: "#6070c0", size: 13 });
  }
  const milestone = COMBO_TITLES.some(t => t.at === mult);
  if (wasSad) {
    sadCheered++;
    sfxSadCheer();
    spawnSpecialCheer(c.x, c.y);
    popFx(c.x, c.y, "#a0e8ff", 1);
  } else if (c.shiny) {
    achievements._shinyHugged = true;
    sfxShiny();
    popFx(c.x, c.y, "#ffe27a", 1.1);
  } else {
    sfxHug(mult);
  }
  if (mult >= 3) sfxCombo(mult);
  if (mult >= 5) screenPulse = Math.min(0.6, 0.15 + mult * 0.025);
  comboBump = 1;
  if (milestone) { comboPop = 1; popFx(c.x, c.y - 6, mult >= 12 ? "#ffd700" : "#ff9ec8", 0.9 + Math.min(0.8, mult * 0.03)); }
  buzz(milestone || wasSad || c.shiny ? "combo" : "hug");

  spawnHearts(c.x, c.y - 10, wasSad ? 12 : c.shiny ? 10 : golden ? 9 : 6, true);
  spawnSparkles(c.x, c.y, wasSad ? 14 : c.shiny ? 12 : 6);
  particles.push({ kind: "ring", x: c.x, y: c.y, life: 0.38, max: 0.38, size: 8, color: wasSad ? "#bdf0ff" : "#ffd0e6", t: 0 });
  addFloat({
    x: c.x, y: c.y - 20,
    text: (wasSad ? ("+" + pts + " Joy!") : (mult > 1 ? ("+" + pts + "  ×" + mult) : ("+" + pts))) + (golden ? " ☀" : ""),
    life: 1.2, vy: -42,
    color: golden ? "#e09000" : wasSad ? "#60d0ff" : c.shiny ? C.gold : C.heart,
    size: wasSad || c.shiny ? 16 : 13,
  });
  if (wasSad) addFloat({ x: c.x, y: c.y - 44, text: "Cheer!", life: 1.0, vy: -28, color: "#80e0ff", size: 14 });
  // combo titles only on the milestone hug itself (not on every hug after it) — cute, not noisy
  let ct = null;
  for (const t of COMBO_TITLES) if (mult === t.at) ct = t;
  if (ct) {
    addFloat({
      x: c.x, y: c.y - (wasSad ? 62 : 48), text: ct.text,
      life: 1.1, vy: -32, color: "#ff80b0", size: 13 + Math.min(4, Math.floor(mult / 5)), big: milestone,
    });
  }
  checkFriendship(c.animal);
  checkAchievements();
  if (tut) tutEvent("hug");
  saveSoon();
}

// Tapping a critter that is mid-hug: pets it (heart eyes, then a spin)
function petCritter(c) {
  c.pets++;
  c.stay = true;
  c.stateT = Math.min(c.stateT, 0.15);
  c.hugScale = 1.08;
  c.sqT = 0; c.sqAmp = 0.16;
  joy += 1;
  spawnHearts(c.x, c.y - 14, 2);
  sfxPet();
  buzz("pet");
  if (c.pets >= 2) c.heartEyesT = 1.8;
  if (c.pets % 4 === 0) {
    c.spinT = 0.6;
    joy += 5;
    sfxSpin();
    addFloat({ x: c.x, y: c.y - 40, text: "Spin! +5", life: 1.0, vy: -30, color: "#ff60a0", size: 13 });
  }
}

function spawnSpecialCheer(x, y) {
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    particles.push({ kind: "star", x, y, vx: Math.cos(a) * 60, vy: Math.sin(a) * 60 - 20, life: 0.9, max: 0.9, size: 5, color: "#80d0ff" });
  }
  particles.push({ kind: "ring", x, y, life: 0.55, max: 0.55, size: 8, color: "#a0e8ff" });
}

function startIdle(c) {
  if (Math.random() < 0.45) { c.idle = "nap"; c.idleDur = 5 + Math.random() * 4; }
  else { c.idle = "wave"; c.idleDur = 1.8; }
}
function endIdle(c) { c.idle = null; c.idleT = 7 + Math.random() * 9; }

function updateCritter(c, dt) {
  c.phase += dt * (c.dancing ? 5 : c.idle === "nap" ? 0.8 : 2.2);
  c.life -= dt;
  if (c.sqT < 9) c.sqT += dt;
  if (c.heartEyesT > 0) c.heartEyesT -= dt;
  if (c.spinT > 0) c.spinT = Math.max(0, c.spinT - dt);
  if (c.state === "float") {
    if (!c.parade && !c.sad) {
      if (c.idle) {
        c.idleDur -= dt;
        if (c.idleDur <= 0 || c.life < 0 || magnetT > 0) endIdle(c);
      } else {
        c.idleT -= dt;
        if (c.idleT <= 0 && magnetT <= 0 && c.life > 4) startIdle(c);
      }
    }
    if (magnetT > 0 && !c.parade) {
      const ang = (c.id * 2.399) % (Math.PI * 2);
      const [y0, y1] = critterYRange();
      const tx = clamp(pointer.x + Math.cos(ang) * 30, 20, W - 20);
      const ty = clamp(pointer.y + Math.sin(ang) * 22, y0 - 20, y1 + 20);
      const k = Math.min(1, dt * 1.8);
      c.x += (tx - c.x) * k;
      c.baseY += (ty - c.baseY) * k;
      c.life = Math.max(c.life, 1.5);
    } else if (c.idle !== "nap") {
      c.x += c.vx * dt;
    }
    c.y = c.baseY + Math.sin(c.phase) * c.bobAmp * (c.idle === "nap" ? 0.3 : 1);
    c.hugScale += (1 - c.hugScale) * Math.min(1, dt * 8);
    const half = c.scale * c.hugScale * SPRITE_SIZE * 0.5;
    if (c.parade) {
      if ((c.vx > 0 && c.x > W + half + 10) || (c.vx < 0 && c.x < -half - 10)) c.dead = true;
    } else {
      const minX = half + 2, maxX = W - half - 2;
      if (c.x < minX || c.x > maxX) {
        if (c.life < 0) { c.state = "leave"; c.stateT = 0; }
        else {
          c.vx *= -1;
          c.x = Math.max(minX, Math.min(maxX, c.x));
        }
      }
      if (c.life < 0 && (c.x <= minX + 4 || c.x >= maxX - 4)) { c.state = "leave"; c.stateT = 0; }
    }
  } else if (c.state === "happy") {
    c.stateT += dt;
    c.y = c.baseY + Math.sin(c.stateT * 18) * 10 * Math.max(0, 1 - c.stateT);
    c.hugScale = 1 + Math.sin(c.stateT * 12) * 0.06 * Math.max(0, 1 - c.stateT);
    if (c.stateT > 0.55) {
      if (c.parade) {
        c.state = "leave"; c.stateT = 0; c.vx = (c.vx >= 0 ? 1 : -1) * 70;
      } else if (mood >= 100 || c.stay || Math.random() < 0.35) {
        c.state = "float";
        c.life = Math.max(c.life, 2 + Math.random() * 3);
        c.baseY = c.y;
        if (mood >= 100) c.dancing = true;
      } else {
        c.state = "leave";
        c.stateT = 0;
        c.vx = (c.x < W / 2 ? -1 : 1) * 80;
      }
    }
  } else if (c.state === "leave") {
    c.stateT += dt;
    c.x += c.vx * dt;
    c.y -= 30 * dt;
    c.hugScale *= 0.98;
    if (c.stateT > 1.2 || c.x < -60 || c.x > W + 60) c.dead = true;
  }
}

const HEART_COLS = ["#ff6b9d", "#ff6b9d", "#ff8ab8", "#ffd0e0", "#ff5a8a"];
function spawnHearts(x, y, n, burst) {
  for (let i = 0; i < n; i++) {
    // burst: fan out upward in an arc, then drift up with a gentle wobble
    const a = burst ? -Math.PI / 2 + ((i + 0.5) / n - 0.5) * 2.4 + (Math.random() - 0.5) * 0.3 : 0;
    const sp = burst ? 85 + Math.random() * 55 : 0;
    const life = 0.85 + Math.random() * 0.45;
    particles.push({
      kind: "heart", x: x + (Math.random() - 0.5) * (burst ? 6 : 20), y: y + (Math.random() - 0.5) * (burst ? 6 : 10),
      vx: burst ? Math.cos(a) * sp : (Math.random() - 0.5) * 40,
      vy: burst ? Math.sin(a) * sp : -40 - Math.random() * 50,
      life, max: life, size: (burst ? 5 : 4) + Math.random() * 4, t: 0, wob: Math.random() * 6.28, drag: burst ? 3.2 : 0,
      color: HEART_COLS[Math.floor(Math.random() * HEART_COLS.length)],
    });
  }
}
// A soft, screen-shake-free "pop": a quick glow disc + a crisp expanding ring
function popFx(x, y, color, k) {
  k = k || 1;
  particles.push({ kind: "glow", x, y, life: 0.32, max: 0.32, size: 18 * k, color, t: 0 });
  particles.push({ kind: "ring", x, y, life: 0.5, max: 0.5, size: 10 * k, color, t: 0, grow: 110 * k, lw: 3 });
}
function addFloat(f) {
  f.t = 0; f.max = f.life;
  if (floatTexts.length >= 28) {
    const i = floatTexts.findIndex(o => !o.toast);
    if (i >= 0) floatTexts.splice(i, 1);
  }
  floatTexts.push(f);
}
// in-place filter: avoids allocating a new array every frame
function prune(arr, keep) {
  let j = 0;
  for (let i = 0; i < arr.length; i++) if (keep(arr[i])) arr[j++] = arr[i];
  arr.length = j;
  return arr;
}
const alive = p => p.life > 0;
function countIf(arr, pred) { let n = 0; for (let i = 0; i < arr.length; i++) if (pred(arr[i])) n++; return n; }
const isRoamer = c => !c.parade;
const isFloating = c => c.state === "float";
const notDead = o => !o.dead;
function spawnSparkles(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 30 + Math.random() * 70;
    particles.push({
      kind: "spark", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20,
      life: 0.4 + Math.random() * 0.4, max: 0.8, size: 2 + Math.random() * 3,
      color: ["#fff", "#ffe080", "#ffb0d0", "#c0e8ff", "#a0ffc0"][Math.floor(Math.random() * 5)],
    });
  }
}
function spawnConfetti(n) {
  const cols = ["#ff6b9d", "#ffd700", "#70c0ff", "#90e070", "#c9a0ff", "#ff9e7a"];
  for (let i = 0; i < n; i++) {
    confetti.push({
      x: Math.random() * W, y: -10 - Math.random() * 80,
      vx: (Math.random() - 0.5) * 40, vy: 40 + Math.random() * 60,
      life: 3 + Math.random() * 2, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 8,
      color: cols[Math.floor(Math.random() * cols.length)],
      w: 4 + Math.random() * 5, h: 3 + Math.random() * 4,
    });
  }
}

function updateParticles(dt) {
  for (const p of particles) {
    p.life -= dt;
    p.t = (p.t || 0) + dt;
    if (p.kind === "ring") { p.size += (p.grow || 80) * dt; continue; }
    if (p.kind === "glow") continue;
    if (p.drag) { const k = Math.max(0, 1 - p.drag * dt); p.vx *= k; if (p.vy < -30) p.vy *= k; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += (p.kind === "heart" ? -10 : p.float ? -4 : 40) * dt;
    if (p.kind === "bubble") p.x += Math.sin(p.t * 3 + (p.wob || 0)) * 12 * dt;
  }
  prune(particles, alive);
  if (particles.length > 400) particles.splice(0, particles.length - 400);
  const fk = Math.pow(0.96, dt * 60);
  for (const f of floatTexts) {
    f.life -= dt;
    f.t = (f.t || 0) + dt;
    f.y += f.vy * dt;
    f.vy *= fk;
  }
  prune(floatTexts, alive);
  if (toastQueue.length) pumpToasts();
  for (const cf of confetti) {
    cf.life -= dt;
    cf.x += cf.vx * dt;
    cf.y += cf.vy * dt;
    cf.rot += cf.vr * dt;
    cf.vy += 20 * dt;
  }
  prune(confetti, c => c.life > 0 && c.y < H + 20);
  // banners wait politely while a friendship level-up card is showing
  if (storyBanner && !levelUpFx) {
    storyBanner.life -= dt;
    if (storyBanner.life <= 0) storyBanner = bannerQueue.shift() || null;
  }
  if (screenPulse > 0) screenPulse = Math.max(0, screenPulse - dt * 1.8);
  if (comboPop > 0) comboPop = Math.max(0, comboPop - dt * 1.6);
  if (comboBump > 0) comboBump = Math.max(0, comboBump - dt * 6);
  if (levelUpFx) { levelUpFx.t += dt; if (levelUpFx.t > levelUpFx.dur) levelUpFx = null; }
}

function spawnGloomCloud(storm) {
  if (gloomClouds.length >= (storm ? 9 : 4)) return false;
  const fromLeft = Math.random() < 0.5;
  gloomClouds.push({
    x: fromLeft ? -50 : W + 50,
    y: 40 + Math.random() * (storm ? Math.min(200, H * 0.35) : 120),
    s: storm ? 1.0 + Math.random() * 0.4 : 0.9 + Math.random() * 0.5,

    phase: Math.random() * 6,
    life: storm ? 22 + Math.random() * 6 : 14 + Math.random() * 8,
    drainAcc: 0, storm: !!storm,
  });
  return true;
}

function shooGloom(gc, moodAmt) {
  if (gc.dead) return;
  gc.dead = true;
  cloudsShooed++;
  addMood(moodAmt == null ? 0.7 : moodAmt);
  joy += 8;

  }

    });

  checkAchievements();
  if (tut) tutEvent("shoo");
  saveSoon();
}

function updateGloom(dt) {
  if (!tut) gloomSpawnTimer -= dt; // the tutorial brings its own single cloud
  const rate = mood < 30 ? 2.8 : mood < 60 ? 4.2 : mood < 90 ? 5.5 : 8;
  if (gloomSpawnTimer <= 0) {
    spawnGloomCloud(false);
    gloomSpawnTimer = rate * (0.7 + Math.random() * 0.6);
  }
  let gloomDrain = 0;
  for (const gc of gloomClouds) {
    gc.x += gc.vx * dt;
    gc.y += Math.sin(time * 1.2 + gc.phase) * 8 * dt;
    gc.life -= dt;
    if (mood < 100) gloomDrain += 0.11 * dt;
    if (gc.tut) {
      // tutorial cloud politely stays on screen until shooed
      gc.life = Math.max(gc.life, 5);
      if ((gc.x > W - 70 && gc.vx > 0) || (gc.x < 16 && gc.vx < 0)) gc.vx *= -1;
    }
    if (gc.storm && gc.life > 2) {
      // storm clouds linger on screen
      if (gc.x > W - 40 && gc.vx > 0) gc.vx *= -1;
      if (gc.x < -10 && gc.vx < 0 && gc.life < 20) gc.vx *= -1;
    }
    if (gc.life <= 0 || gc.x < -80 || gc.x > W + 80) gc.dead = true;
  }
  if (gloomDrain > 0) {
    addMood(-gloomDrain);
    for (const gc of gloomClouds) gc.drainAcc = (gc.drainAcc || 0) + dt;
    if (gloomClouds.some(gc => gc.drainAcc >= 1)) {
      joyStreak = 0;
      for (const gc of gloomClouds) gc.drainAcc = 0;
    }
  }
  prune(gloomClouds, notDead);
}

const EVENT_INFO = {
  parade: ["Critter Parade!", "Hug every marcher for a bonus!"],
  golden: ["Golden Hour!", "Double hearts for 15 seconds ☀"],
  storm: ["Gloom Storm!", "Shoo every cloud for a big reward!"],
  rain: ["Rainbow Rain!", "Tap the sparkly drops!"],
};
let lastEventType = "";
let eventBag = [];

function startEvent(type) {
  if (!type) {
    // shuffled bag so every event shows up regularly, never twice in a row
    if (!eventBag.length) {
      eventBag = ["parade", "golden", "storm", "rain"].sort(() => Math.random() - 0.5);
      if (eventBag[0] === lastEventType) eventBag.push(eventBag.shift());
    }
    type = eventBag.shift();
    if (type === "storm" && mood >= 100) type = eventBag.shift() || "golden";
  }
  lastEventType = type;
  stats.events++;
  const info = EVENT_INFO[type];
  showBanner(info[0], info[1], 2.6);
  sfxEvent();
  if (type === "parade") {
    const list = unlockedList();
    const n = 6;
    const [y0, y1] = critterYRange();
    const y = y0 + 40 + Math.random() * Math.max(10, y1 - y0 - 80);
    const fromLeft = Math.random() < 0.5;
    for (let i = 0; i < n; i++) {
      const animal = list[Math.floor(Math.random() * list.length)];
      critters.push(makeCritter(animal, {
        parade: true, scale: 1.55, y,
        x: fromLeft ? -30 - i * 46 : W + 30 + i * 46,
        vx: (fromLeft ? 1 : -1) * 46, bobAmp: 5, phase: i * 0.9, life: 999,
      }));
    }
    activeEvent = { type, t: 0, total: n, hugged: 0 };
  } else if (type === "golden") {
    stats.goldenHours++;
    activeEvent = { type, t: 0, dur: 15 };
  } else if (type === "storm") {
    activeEvent = { type, t: 0, dur: 24, toSpawn: 6, spawnT: 0, total: 6, spawned: 0, shooed: 0 };
  } else if (type === "rain") {
    activeEvent = { type, t: 0, dur: 12, spawnT: 0, caught: 0 };
  }
}

function endEvent(title, sub) {
  if (title) showBanner(title, sub || "", 2.4);
  activeEvent = null;
  eventTimer = 55 + Math.random() * 30;
  checkAchievements();
  save();
}

function updateEvents(dt, wdt) {
  if (!activeEvent) {
    if (tut) return;
    eventTimer -= dt;
    if (eventTimer <= 0 && !storyBanner) startEvent();
    return;
  }
  const ev = activeEvent;
  ev.t += dt;
  if (ev.type === "parade") {
    const left = critters.filter(c => c.parade && !c.dead).length;
    if (left === 0 || ev.t > 30) {
      critters.forEach(c => { if (c.parade) c.parade = false; });
      if (ev.hugged >= ev.total) {
        stats.parades++;
        joy += 80; addMood(2);
        spawnConfetti(40); sfxUnlock();
        endEvent("Perfect Parade!", "+80 ♥ and a burst of Joy");
      } else {
        const bonus = ev.hugged * 5;
        joy += bonus;
        endEvent("The parade waves goodbye", ev.hugged + "/" + ev.total + " hugged · +" + bonus + " ♥");
      }
    }
  } else if (ev.type === "golden") {
    if (Math.random() < dt * 6) {
      particles.push({ kind: "spark", x: Math.random() * W, y: 80 + Math.random() * (H - 200), vx: 0, vy: -10, life: 1, max: 1, size: 3, color: "#ffe08a" });
    }
    if (ev.t >= ev.dur) endEvent("Golden Hour fades…", "What a warm glow.");
  } else if (ev.type === "storm") {
    if (ev.spawned < ev.toSpawn) {
      ev.spawnT -= dt;
      if (ev.spawnT <= 0) {
        if (spawnGloomCloud(true)) ev.spawned++;
        ev.spawnT = 0.6;
      }
    }
    if (ev.shooed >= ev.total) {
      stats.storms++;
      joy += 120; addMood(3);
      spawnConfetti(40); sfxUnlock();
      endEvent("Storm calmed!", "+120 ♥ · the sky exhales");
    } else if (ev.t > ev.dur) {
      gloomClouds.forEach(g => { if (g.storm) g.life = Math.min(g.life, 3); });
      endEvent("The storm drifts away", ev.shooed + "/" + ev.total + " clouds shooed");
    }
  } else if (ev.type === "rain") {
    if (ev.t < ev.dur) {
      ev.spawnT -= wdt;
      if (ev.spawnT <= 0) {
        drops.push({ x: 20 + Math.random() * (W - 40), y: 70, vy: 55 + Math.random() * 35, vx: (Math.random() - 0.5) * 12, hue: Math.random() * 360, ph: Math.random() * 6 });
        ev.spawnT = 0.42;
      }
    } else if (!drops.length) {
      const bonus = ev.caught >= 15 ? 40 : 0;
      joy += bonus;
      endEvent("Rainbow Rain ends", "Caught " + ev.caught + " drops" + (bonus ? " · +" + bonus + " ♥ bonus" : ""));
    }
  }
}

function updateDrops(wdt) {
  for (const d of drops) {
    d.y += d.vy * wdt;
    d.x += d.vx * wdt + Math.sin(time * 3 + d.ph) * 10 * wdt;
    if (d.y > H - 60) {
      d.dead = true;
      particles.push({ kind: "ring", x: d.x, y: d.y, life: 0.35, max: 0.35, size: 3, color: "hsl(" + d.hue + ",80%,75%)" });

  prune(drops, notDead);
}

function catchDrop(d) {

function updatePowerups(dt, wdt) {

    if (powerups.length < 1) spawnPowerup();
    powerTimer = 26 + Math.random() * 16;
  }
  for (const p of powerups) {
    p.x += p.vx * wdt;
    p.ph += dt;
    p.y = p.baseY + Math.sin(p.ph * 2) * 8;
    p.life -= dt;
    if (p.life <= 0 || p.x < -40 || p.x > W + 40) p.dead = true;
  }
  prune(powerups, notDead);
  if (slowT > 0) slowT = Math.max(0, slowT - dt);
  if (magnetT > 0) magnetT = Math.max(0, magnetT - dt);
}

function activatePowerup(p) {
  p.dead = true;
  stats.powerups++;
  sfxPowerup();
  buzz("combo");
  spawnSparkles(p.x, p.y, 20);
  popFx(p.x, p.y, POWERUPS[p.type].col, 1.2);
  addFloat({ x: W / 2, y: H * 0.42, text: POWERUPS[p.type].name, life: 1.4, vy: -20, color: "#ff60a0", size: 20, big: true });
  if (p.type === "bighug") {
    const targets = critters.filter(c => c.state === "float");
    for (const c of targets) hugCritter(c, 0.25);

  } else if (p.type === "sunbeam") {
    for (const gc of [...gloomClouds]) shooGloom(gc, 0.35);

  }

  save();
}

const pad2 = n => (n < 10 ? "0" : "") + n;
function todayKey(d) { d = d || new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function dayNum(key) {
  const m = /^(\d+)-(\d+)-(\d+)$/.exec(key || "");
  return m ? Math.round(Date.UTC(+m[1], +m[2] - 1, +m[3]) / 864e5) : null;
}
function giftWaiting() { return lastGiftDay !== todayKey(); }
function checkDailyGift() {
  if (!gift && giftWaiting()) gift = { x: W / 2, y: H - 172, t: 0 };
}
function openGift() {
  if (!gift) return;
  const today = todayKey();
  const a = dayNum(lastGiftDay), b = dayNum(today);
  giftStreak = (a != null && b - a === 1) ? giftStreak + 1 : 1;
  bestGiftStreak = Math.max(bestGiftStreak, giftStreak);
  lastGiftDay = today;
  giftsOpened++;
  const streakBonus = Math.min(giftStreak - 1, 6) * 15;
  let hearts = 60 + streakBonus;
  let found = "";
  if (Math.random() < 0.35 + Math.min(giftStreak, 7) * 0.04) {
    const un = SHOP_ACCS.filter(x => !ownedAcc[x.id]);
    if (un.length) { const pick = un[Math.floor(Math.random() * un.length)]; ownedAcc[pick.id] = true; found = pick.name; }
    else hearts += 40;
  }
  joy += hearts;
  addMood(1);
  spawnConfetti(36);
  spawnSparkles(gift.x, gift.y, 24);
  spawnHearts(gift.x, gift.y, 10);
  sfxGift();
  buzz("gift");
  showBanner("Daily Gift! Day " + giftStreak + (giftStreak > 1 ? " streak ♥" : ""),
    "+" + hearts + " ♥" + (streakBonus ? " (streak +" + streakBonus + ")" : "") + (found ? " · Found: " + found + "!" : ""), 3.4);
  gift = null;
  checkAchievements();
  save();
}

  gloomSpawnTimer = 2;

  powerTimer = 18 + Math.random() * 10;

    startTutorial();
  } else if (!storySeen[0] && mood < 20) {

    showStory(STORY[0].title, STORY[0].sub);
  }

function updatePlay(dt) {
  const wdt = dt * (slowT > 0 ? 0.45 : 1);
  spawnTimer -= wdt;
  if (spawnTimer <= 0 && countIf(critters, isRoamer) < MAX_CRITTERS) {
    spawnCritter();
    const density = 0.75 + unlockedList().length * 0.04;
    spawnTimer = SPAWN_BASE / density * (0.5 + Math.random() * 0.8);
  }
  if (countIf(critters, isFloating) < 2 && Math.random() < dt * 0.5) spawnCritter();

  updateGloom(wdt);
  updateEvents(dt, wdt);
  updatePowerups(dt, wdt);
  updateDrops(wdt);

  if (!tut) {
    giftCheckT -= dt;
    if (giftCheckT <= 0) { giftCheckT = 15; checkDailyGift(); }
  }
  if (gift) gift.t += dt;

  if (comboTimer > 0) {
    comboTimer -= wdt;
    if (comboTimer <= 0) { combo = 0; joyStreak = Math.max(0, joyStreak - 1); }
  }
  // critters drift slower while the tutorial asks for a first hug
  const cdt = tut && tut.step === 0 ? wdt * 0.55 : wdt;
  for (const c of critters) updateCritter(c, cdt);
  prune(critters, notDead);
  updateParticles(dt);
  if (tut) updateTutorial(dt);
}

function drawHeart(x, y, s, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  const top = y - s * 0.15;
  ctx.moveTo(x, y + s * 0.55);
  ctx.bezierCurveTo(x, y + s * 0.15, x - s * 0.95, y - s * 0.05, x - s * 0.95, y + s * 0.28);
  ctx.bezierCurveTo(x - s * 0.95, y + s * 0.55, x - s * 0.15, y + s * 0.75, x, y + s * 0.95);
  ctx.bezierCurveTo(x + s * 0.15, y + s * 0.75, x + s * 0.95, y + s * 0.55, x + s * 0.95, y + s * 0.28);
  ctx.bezierCurveTo(x + s * 0.95, y - s * 0.05, x, y + s * 0.15, x, y + s * 0.55);
  ctx.fill();
  // soft highlight
  const prevA = ctx.globalAlpha;
  ctx.globalAlpha = prevA * 0.45;
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.ellipse(x - s * 0.35, y + s * 0.2, s * 0.18, s * 0.12, -0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = prevA;
}

const HEART_CELLS = [
  [1,0],[2,0],[4,0],[5,0],
  [0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],
  [0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],
  [1,3],[2,3],[3,3],[4,3],[5,3],
  [2,4],[3,4],[4,4],
  [3,5],
];
// Each heart colour is rendered once into a tiny 7x6 canvas and then blitted (much cheaper than 28 fillRects).
const heartCache = new Map();
function heartSprite(color) {
  let h = heartCache.get(color);
  if (h !== undefined) return h;
  h = null;
  try {
    const off = document.createElement("canvas");
    off.width = 7; off.height = 6;
    const g = off.getContext("2d");
    if (g) {
      g.fillStyle = color;
      for (const c of HEART_CELLS) g.fillRect(c[0], c[1], 1, 1);
      g.fillStyle = "rgba(255,255,255,0.6)";
      g.fillRect(2, 1, 1, 1);
      h = off;
    }
  } catch (e) { h = null; }
  if (heartCache.size < 64) heartCache.set(color, h);
  return h;
}
function drawPixelHeart(x, y, s, color) {
  // chunky cute pixel heart for particles
  const u = Math.max(1, s / 5);
  const spr = heartSprite(color);
  if (spr) { ctx.drawImage(spr, x - 3 * u, y - 2 * u, 7 * u, 6 * u); return; }
  ctx.fillStyle = color;
  for (const c of HEART_CELLS) ctx.fillRect(x + (c[0] - 3) * u, y + (c[1] - 2) * u, u + 0.2, u + 0.2);
}

function drawSparkle(x, y, s, color) {
  ctx.fillStyle = color;
  ctx.globalAlpha = Math.min(1, ctx.globalAlpha);
  // soft 4-point sparkle
  ctx.beginPath();
  ctx.moveTo(x, y - s);
  ctx.quadraticCurveTo(x, y, x + s, y);
  ctx.quadraticCurveTo(x, y, x, y + s);
  ctx.quadraticCurveTo(x, y, x - s, y);
  ctx.quadraticCurveTo(x, y, x, y - s);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.fillRect(x - 1, y - 1, 2, 2);
}

function initDecor() {
  decorClouds = [];
  for (let i = 0; i < 6; i++) {
    decorClouds.push({
      x: Math.random() * W, y: 28 + Math.random() * 110,
      s: 0.55 + Math.random() * 0.85, sp: 3 + Math.random() * 7,
      tone: Math.random(),
    });
  }
  flowers = [];
  const types = ["tulip", "daisy", "bell", "rose", "sprout"];
  for (let i = 0; i < 24; i++) {
    flowers.push({
      x: 8 + Math.random() * (W - 16),
      y: H - 72 + Math.random() * 42,
      col: C.flower[Math.floor(Math.random() * C.flower.length)],
      s: 0.75 + Math.random() * 0.55,
      phase: Math.random() * Math.PI * 2,
      bloom: Math.random(),
      type: types[i % types.length],
    });
  }
}


function getBg() { return BACKGROUNDS.find(b => b.id === bgId) || BACKGROUNDS[0]; }

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 0xff) + amt, b = (n & 0xff) + amt;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function lerpColor(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ar = pa >> 16, ag = (pa >> 8) & 255, ab = pa & 255;
  const br = pb >> 16, bg = (pb >> 8) & 255, bb = pb & 255;
  const r = Math.round(ar + (br - ar) * t);
  const g = Math.round(ag + (bg - ag) * t);
  const bl = Math.round(ab + (bb - ab) * t);
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
}

function moodT() { return Math.max(0, Math.min(1, mood / 100)); }

function worldColors(bg) {
  const t = moodT();
  const grayTop = "#9aa0ac", grayBot = "#c4c0c8", grayGrass = "#7a8078";
  let skyTop = lerpColor(grayTop, bg.skyTop, Math.pow(t, 0.85));
  let skyBot = lerpColor(grayBot, bg.skyBot, Math.pow(t, 0.85));
  let grass = lerpColor(grayGrass, bg.grass, Math.pow(t, 0.9));
  if (t > 0.75 && bg.vibrant) {
    const v = (t - 0.75) / 0.25;
    skyTop = lerpColor(skyTop, "#ff70c0", v * 0.35);
    skyBot = lerpColor(skyBot, "#ffe080", v * 0.3);
  }
  return { skyTop, skyBot, grass, t };
}


function drawCloud(x, y, s, col, opts) {
  opts = opts || {};
  const shade2 = opts.shade || col;
  const hi = opts.hi || "rgba(255,255,255,0.35)";
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.arc(x, y, 13 * s, 0, Math.PI * 2);
  ctx.arc(x + 15 * s, y - 5 * s, 17 * s, 0, Math.PI * 2);
  ctx.arc(x + 30 * s, y, 13 * s, 0, Math.PI * 2);
  ctx.arc(x + 15 * s, y + 6 * s, 12 * s, 0, Math.PI * 2);
  ctx.arc(x + 7 * s, y + 2 * s, 10 * s, 0, Math.PI * 2);
  ctx.fill();
  // multi-tone fluff
  ctx.fillStyle = shade2;
  ctx.beginPath();
  ctx.arc(x + 15 * s, y + 4 * s, 11 * s, 0, Math.PI * 2);
  ctx.arc(x + 26 * s, y + 2 * s, 9 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = hi;
  ctx.beginPath();
  ctx.arc(x + 10 * s, y - 6 * s, 7 * s, 0, Math.PI * 2);
  ctx.arc(x + 20 * s, y - 7 * s, 5 * s, 0, Math.PI * 2);
  ctx.fill();
}

function drawGloomCloud(gc) {
  const pulse = 1 + Math.sin(time * 3 + gc.phase) * 0.04;
  const s = gc.s * pulse;
  ctx.save();
  ctx.globalAlpha = 0.78 + Math.sin(time * 2 + gc.phase) * 0.08;
  // spooky-cute rounded purple-gray
  drawCloud(gc.x, gc.y, s, "#5a5470", {
    shade: "#3e3850",
    hi: "rgba(160,150,190,0.25)",
  });
  drawCloud(gc.x + 3, gc.y + 3, s * 0.72, "#4a4460", {
    shade: "#322c45",
    hi: "rgba(140,130,180,0.2)",
  });
  // tiny glowing eyes
  const ex1 = gc.x + 11 * s, ex2 = gc.x + 23 * s, ey = gc.y - 1;
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = "#c8e8ff";
  ctx.shadowColor = "#80d0ff";
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(ex1, ey, 3.2, 0, Math.PI * 2);
  ctx.arc(ex2, ey, 3.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#1a1528";
  ctx.beginPath();
  ctx.arc(ex1 + 0.5, ey + 0.3, 1.4, 0, Math.PI * 2);
  ctx.arc(ex2 + 0.5, ey + 0.3, 1.4, 0, Math.PI * 2);
  ctx.fill();
  // tiny cheek blush for cute
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = "#a080c0";
  ctx.beginPath();
  ctx.ellipse(ex1 - 5, ey + 5, 2.5, 1.5, 0, 0, Math.PI * 2);
  ctx.ellipse(ex2 + 5, ey + 5, 2.5, 1.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawFlower(f, bloom, sway, grassCol) {
  const x = f.x + sway, y = f.y;
  ctx.strokeStyle = shade(grassCol, 15);
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(f.x, y + 10);
  ctx.quadraticCurveTo(f.x + sway * 0.5, y + 2, x, y - 8);
  ctx.stroke();
  const ps = 3.2 * f.s * bloom;
  if (f.type === "daisy") {
    ctx.fillStyle = f.col;
    for (let p = 0; p < 6; p++) {
      const a = (p / 6) * Math.PI * 2 + time * 0.2;
      ctx.beginPath();
      ctx.ellipse(x + Math.cos(a) * ps, y - 8 + Math.sin(a) * ps, 2.4 * f.s * bloom, 1.6 * f.s * bloom, a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#ffe080";
    ctx.beginPath(); ctx.arc(x, y - 8, 2.0 * f.s * bloom, 0, Math.PI * 2); ctx.fill();
  } else if (f.type === "tulip") {
    ctx.fillStyle = f.col;
    ctx.beginPath();
    ctx.moveTo(x, y - 2);
    ctx.quadraticCurveTo(x - 5 * f.s * bloom, y - 10, x, y - 14 * bloom);
    ctx.quadraticCurveTo(x + 5 * f.s * bloom, y - 10, x, y - 2);
    ctx.fill();
    ctx.fillStyle = shade(f.col, 30);
    ctx.beginPath();
    ctx.moveTo(x, y - 4);
    ctx.quadraticCurveTo(x - 2, y - 10, x, y - 13 * bloom);
    ctx.quadraticCurveTo(x + 2, y - 10, x, y - 4);
    ctx.fill();
  } else if (f.type === "bell") {
    ctx.fillStyle = f.col;
    ctx.beginPath();
    ctx.ellipse(x, y - 7, 3.5 * f.s * bloom, 4.2 * f.s * bloom, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = shade(f.col, -25);
    ctx.beginPath();
    ctx.ellipse(x, y - 4, 3.2 * f.s * bloom, 1.5 * f.s * bloom, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (f.type === "rose") {
    ctx.fillStyle = f.col;
    ctx.beginPath(); ctx.arc(x, y - 8, 3.5 * f.s * bloom, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = shade(f.col, 25);
    ctx.beginPath(); ctx.arc(x - 1, y - 9, 2.2 * f.s * bloom, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = shade(f.col, -20);
    ctx.beginPath(); ctx.arc(x + 1.5, y - 7, 1.8 * f.s * bloom, 0, Math.PI * 2); ctx.fill();
  } else {
    // sprout
    ctx.fillStyle = shade(grassCol, 40);
    ctx.beginPath();
    ctx.ellipse(x - 3, y - 4, 3 * f.s * bloom, 1.6 * f.s * bloom, -0.5, 0, Math.PI * 2);
    ctx.ellipse(x + 3, y - 5, 3 * f.s * bloom, 1.6 * f.s * bloom, 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawSun(cx, cy, r, t) {
  // soft rays
  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalAlpha = 0.2 + t * 0.35;
  ctx.strokeStyle = "#ffe566";
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + time * 0.15;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * (r + 4), Math.sin(a) * (r + 4));
    ctx.lineTo(Math.cos(a) * (r + 14 + t * 6), Math.sin(a) * (r + 14 + t * 6));
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // body
  const g = ctx.createRadialGradient(0, 0, 2, 0, 0, r);
  g.addColorStop(0, "#fff6c0");
  g.addColorStop(0.55, "#ffe566");
  g.addColorStop(1, "#ffc040");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  // cute face
  ctx.fillStyle = "#c87820";
  ctx.beginPath();
  ctx.arc(-r * 0.28, -r * 0.1, r * 0.1, 0, Math.PI * 2);
  ctx.arc(r * 0.28, -r * 0.1, r * 0.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#c87820";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, r * 0.15, r * 0.28, 0.15, Math.PI - 0.15);
  ctx.stroke();
  // blush
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = "#ff9e7a";
  ctx.beginPath();
  ctx.ellipse(-r * 0.45, r * 0.15, r * 0.12, r * 0.07, 0, 0, Math.PI * 2);
  ctx.ellipse(r * 0.45, r * 0.15, r * 0.12, r * 0.07, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

let skyGrad = null, skyKey = "";
function drawBackground() {
  const bg = getBg();
  const wc = worldColors(bg);
  const key = wc.skyTop + wc.skyBot + H;
  if (key !== skyKey || !skyGrad) {
    skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, wc.skyTop);
    skyGrad.addColorStop(1, wc.skyBot);
    skyKey = key;
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  const sunBright = 0.3 + wc.t * 0.7;
  if (bg.night && wc.t > 0.4) {
    ctx.fillStyle = "#f0e8c0";
    ctx.globalAlpha = 0.5 + wc.t * 0.5;
    ctx.beginPath(); ctx.arc(W - 50, 50, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = wc.skyTop;
    ctx.beginPath(); ctx.arc(W - 42, 44, 18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff8d0";
    for (let i = 0; i < 30; i++) {
      const sx = (i * 97 + 13) % W;
      const sy = (i * 53 + 7) % 180;
      const tw = 0.5 + 0.5 * Math.sin(time * 2 + i);
      ctx.globalAlpha = (0.3 + tw * 0.6) * wc.t;
      // tiny sparkle stars
      const ss = 1 + (i % 3);
      ctx.fillRect(sx, sy, ss, ss);
      if (i % 4 === 0) {
        ctx.fillRect(sx - 1, sy + 1, 1, 1);
        ctx.fillRect(sx + ss, sy + 1, 1, 1);
      }
    }
    ctx.globalAlpha = 1;
  } else {
    ctx.globalAlpha = sunBright;
    drawSun(W - 58, 58, 18 + wc.t * 8, wc.t);
    ctx.globalAlpha = 1;
    // soft glow
    ctx.fillStyle = "rgba(255,240,150," + (0.12 + wc.t * 0.28) + ")";
    ctx.beginPath(); ctx.arc(W - 58, 58, 40 + wc.t * 16, 0, Math.PI * 2); ctx.fill();
  }

  for (const cl of decorClouds) {
    cl.x += cl.sp * frameDt;
    if (cl.x > W + 70) cl.x = -70;
    const a = bg.night ? 0.22 : (0.4 + wc.t * 0.45);
    const base = bg.night
      ? "rgba(200,190,230," + a + ")"
      : "rgba(255,252,248," + a + ")";
    const shadeC = bg.night
      ? "rgba(160,150,190," + (a * 0.7) + ")"
      : "rgba(230,236,245," + (a * 0.75) + ")";
    drawCloud(cl.x, cl.y, cl.s, base, { shade: shadeC, hi: "rgba(255,255,255," + (a * 0.5) + ")" });
  }

  // far hills (layered depth)
  ctx.fillStyle = shade(wc.grass, -35);
  ctx.globalAlpha = 0.55;
  ctx.beginPath();
  ctx.moveTo(0, H - 130);
  ctx.quadraticCurveTo(W * 0.2, H - 175, W * 0.45, H - 140);
  ctx.quadraticCurveTo(W * 0.7, H - 110, W, H - 150);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  // mid hill
  ctx.fillStyle = shade(wc.grass, -12);
  ctx.beginPath();
  ctx.moveTo(0, H - 95);
  ctx.quadraticCurveTo(W * 0.25, H - 145, W * 0.5, H - 105);
  ctx.quadraticCurveTo(W * 0.75, H - 65, W, H - 115);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.fill();

  // near ground with dithered grass feel
  ctx.fillStyle = wc.grass;
  ctx.fillRect(0, H - 58, W, 58);
  // dither / stipple for pixel grass texture
  ctx.fillStyle = shade(wc.grass, 18);
  for (let i = 0; i < 90; i++) {
    const gx = (i * 41 + 9) % W;
    const gy = H - 58 + ((i * 17) % 50);
    if ((i + Math.floor(gx / 3)) % 3 === 0) ctx.fillRect(gx, gy, 2, 1);
  }
  ctx.fillStyle = shade(wc.grass, -15);
  for (let i = 0; i < 70; i++) {
    const gx = (i * 53 + 3) % W;
    const gy = H - 50 + ((i * 23) % 40);
    if ((i + Math.floor(gx / 4)) % 4 === 0) ctx.fillRect(gx, gy, 2, 1);
  }

  // swaying grass blades
  ctx.strokeStyle = shade(wc.grass, 28);
  ctx.lineWidth = 1.4;
  for (let i = 0; i < 48; i++) {
    const gx = (i * 31 + 5) % W;
    const gy = H - 58;
    const sway = Math.sin(time * 2.2 + i) * 3;
    ctx.beginPath();
    ctx.moveTo(gx, gy + 12);
    ctx.quadraticCurveTo(gx + sway, gy - 4, gx + sway * 1.4, gy - 16);
    ctx.stroke();
  }

  for (const f of flowers) {
    const bloom = Math.min(1, Math.max(0, (wc.t - 0.15) / 0.55 + f.bloom * 0.2));
    if (bloom < 0.05) continue;
    const sway = Math.sin(time * 1.5 + f.phase) * 2.2;
    ctx.globalAlpha = bloom;
    drawFlower(f, bloom, sway, wc.grass);
    ctx.globalAlpha = 1;
  }

  if (wc.t > 0.85) {
    const ra = (wc.t - 0.85) / 0.15;
    ctx.globalAlpha = ra * 0.5;
    const cols = ["#ff6b6b","#ffb347","#ffe566","#7dcea0","#5dade2","#af7ac5"];
    cols.forEach((col, i) => {
      ctx.strokeStyle = col;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(W / 2, H - 40, 120 + i * 5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }
}

function applyWorldFilter() {
  const t = moodT();
  if (t < 0.95) {
    ctx.fillStyle = "rgba(160,165,175," + ((1 - t) * 0.22) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  if (screenPulse > 0) {
    ctx.fillStyle = "rgba(255,200,230," + (screenPulse * 0.22) + ")";
    ctx.fillRect(0, 0, W, H);
  }
}


function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function pointIn(px, py, x, y, w, h) {
  return px >= x && px <= x + w && py >= y && py <= y + h;
}
function panelBox(x, y, w, h) {
  ctx.fillStyle = C.panel;
  roundRect(x, y, w, h, 16);
  ctx.fill();
  ctx.strokeStyle = C.panelBorder;
  ctx.lineWidth = 3;
  ctx.stroke();
}
function btn(x, y, w, h, label, opts) {
  opts = opts || {};
  const hot = hitUI && pointIn(hitUI.x, hitUI.y, x, y, w, h);
  ctx.fillStyle = hot ? (opts.hi || C.btnHi) : (opts.bg || C.btn);
  roundRect(x, y, w, h, opts.r || 12);
  ctx.fill();
  ctx.strokeStyle = opts.border || "#ff80b0";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = opts.color || C.btnText;
  ctx.font = "bold " + (opts.size || 16) + 'px "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, x + w / 2, y + h / 2 + 1);
  return { x, y, w, h, id: opts.id };
}

const meterGrads = new Map();
function drawMoodMeter(x, y, w, h) {
  ctx.fillStyle = "rgba(60,50,70,0.35)";
  roundRect(x, y, w, h, h / 2);
  ctx.fill();
  const t = moodT();
  const fw = Math.max(4, w * t);
  const gk = x + "," + y + "," + w;
  let grad = meterGrads.get(gk);
  if (!grad) {
    grad = ctx.createLinearGradient(x, y, x + w, y);
    grad.addColorStop(0, "#8890a0");
    grad.addColorStop(0.25, "#c0b0d0");
    grad.addColorStop(0.5, "#ffb0d0");
    grad.addColorStop(0.75, "#ffd070");
    grad.addColorStop(1, "#a0ffd0");
    if (meterGrads.size < 8) meterGrads.set(gk, grad);
  }
  ctx.fillStyle = grad;
  roundRect(x, y, fw, h, h / 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.5)";
  ctx.lineWidth = 1.5;
  roundRect(x, y, w, h, h / 2);
  ctx.stroke();
  drawHeart(x + fw, y + h / 2 - 1, 6, t > 0.5 ? C.heart : "#a0a8b8");
  ctx.font = 'bold 10px "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(74,48,80,0.85)";
  ctx.fillText("Joy " + Math.floor(mood) + "%", x + w / 2, y + h / 2 + 0.5);
}

function easeOutBack(t) { const c = 1.7; t = clamp(t, 0, 1) - 1; return 1 + (c + 1) * t * t * t + c * t * t; }
function easeOutCubic(t) { t = 1 - clamp(t, 0, 1); return 1 - t * t * t; }
function drawStoryBanner() {
  const b = storyBanner;
  if (!b || levelUpFx) return;
  const age = b.max - b.life;
  const IN = 0.38, OUT = 0.4;
  let alpha = 1, scale = 1, dy = 0;
  if (age < IN) {
    const e = easeOutBack(age / IN);
    scale = 0.82 + 0.18 * e; dy = (1 - e) * -14; alpha = Math.min(1, age / (IN * 0.6));
  } else if (b.life < OUT) {
    const e = easeOutCubic(1 - b.life / OUT);
    alpha = 1 - e; dy = -12 * e; scale = 1 - 0.04 * e;
  }
  if (alpha <= 0.01) return;
  if (!b.fit) {
    // fit long titles/subtitles once, not every frame
    b.fit = [fitFont(b.title, W - 76, 16, true, 11), fitFont(b.sub, W - 70, 12, false, 9)];
  }
  const cy = 194;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W / 2, cy + dy);
  ctx.scale(scale, scale);
  ctx.translate(-W / 2, -cy);
  solidPanel(24, 150, W - 48, 88);
  drawPixelHeart(40, 166, 5, "#ffb0cc");
  drawPixelHeart(W - 40, 166, 5, "#ffb0cc");
  ctx.fillStyle = C.text;
  font(b.fit[0], true);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(b.title, W / 2, 180);
  font(b.fit[1], false);
  ctx.fillStyle = C.textSoft;
  ctx.fillText(b.sub, W / 2, 208);
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const lf = Math.max(0, p.life / (p.max || 1));
    ctx.globalAlpha = lf;
    if (p.kind === "heart") {
      // pop in with a tiny overshoot, wobble while drifting, fade in the last third
      const t = p.t || 0;
      const grow = t < 0.16 ? easeOutBack(t / 0.16) : 1;
      ctx.globalAlpha = Math.min(1, lf * 3);
      drawPixelHeart(p.x + Math.sin(t * 7 + (p.wob || 0)) * 2.2, p.y, p.size * Math.max(0.2, grow), p.color);
    } else if (p.kind === "glow") {
      ctx.globalAlpha = lf * 0.45;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (1.4 - lf * 0.4), 0, Math.PI * 2);
      ctx.fill();
    } else if (p.kind === "ring") {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = (p.lw || 2) * (0.4 + lf * 0.6);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.stroke();
    } else if (p.kind === "star") {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = -Math.PI / 2 + (i * Math.PI * 2) / 5;
        const r = i % 2 === 0 ? p.size : p.size * 0.45;
        const px = p.x + Math.cos(a) * r, py = p.y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
    } else if (p.kind === "poof") {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (p.life / p.max), 0, Math.PI * 2);
      ctx.fill();
    } else if (p.kind === "spark") {
      drawSparkle(p.x, p.y, p.size + 1, p.color);
    } else if (p.kind === "bubble") {
      ctx.globalAlpha = Math.min(1, lf * 2.5, (p.t || 0) * 5);
      ctx.strokeStyle = "rgba(170,140,255,0.9)"; ctx.lineWidth = 1.2;
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.fillRect(p.x - p.size * 0.5, p.y - p.size * 0.5, 1.5, 1.5);
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  for (const cf of confetti) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, cf.life);
    ctx.translate(cf.x, cf.y);
    ctx.rotate(cf.rot);
    ctx.fillStyle = cf.color;
    ctx.fillRect(-cf.w / 2, -cf.h / 2, cf.w, cf.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.lineJoin = "round";
  for (const f of floatTexts) {
    // sticker-style numbers: pop in (bigger pop for milestones), soft white outline, gentle fade-out
    const t = f.t || 0;
    const popT = f.big ? 0.26 : 0.18;
    const sc = t < popT ? (f.big ? 0.4 : 0.6) + (f.big ? 0.6 : 0.4) * easeOutBack(t / popT) : 1;
    const a = Math.min(1, f.life / 0.35, t / 0.06 + 0.3);
    if (a <= 0.01) continue;
    ctx.globalAlpha = a;
    font(Math.max(6, Math.round(f.size * sc * 2) / 2), true);
    // keep text fully on screen (measured once at full size)
    if (f.hw == null) { font(f.size, true); f.hw = ctx.measureText(f.text).width / 2 + 4; font(Math.max(6, Math.round(f.size * sc * 2) / 2), true); }
    const fx = clamp(f.x, f.hw, W - f.hw);
    if (f.toast) {
      // toasts sit on a soft pill so they read over any sky
      const pw = f.hw * 2 + 8;
      ctx.fillStyle = "rgba(255,250,245,0.9)";
      roundRect(fx - pw / 2, f.y - 10, pw, 20, 10); ctx.fill();
      ctx.strokeStyle = "rgba(255,184,208,0.9)"; ctx.lineWidth = 1.5; ctx.stroke();
    } else {
      ctx.strokeStyle = "rgba(255,255,255,0.85)";
      ctx.lineWidth = 3;
      ctx.strokeText(f.text, fx, f.y);
    }
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, fx, f.y);
  }
  ctx.globalAlpha = 1;
}


// ===================== ACHIEVEMENTS =====================
function checkAchievements() {
  const snap = {
    totalHugs, highCombo, highScore, unlocked, unlockedBgs, achievements,
    cloudsShooed, sadCheered, moodPeak, dawnCount,
    friendLvl, ownedAcc, equipped, stats, giftsOpened, bestGiftStreak,
    gardenPlaced: garden.placedEver, cozy: gardenCozy(), gardenVisits: garden.visits,
    gardenBubbles: garden.bubbles, awayCollected: garden.awayCollected, gardenHas: gardenHas(),
  };
  for (const g of GOALS) {
    if (achievements[g.id]) continue;
    let ok = false;
    try { ok = g.check(snap); } catch (e) { ok = false; }
    if (ok) {
      achievements[g.id] = true;
      joy += g.reward;
      addMood(1.5);
      toast("✨ " + g.label + "! +" + g.reward);
      sfxUnlock();
      buzz("unlock");
      save();
    }
  }
}

function fitFont(text, maxW, px, bold, minPx) {
  let size = px;
  font(size, bold);
  while (size > (minPx || 8) && ctx.measureText(text).width > maxW) { size -= 0.5; font(size, bold); }
  return size;
}
function listClip(top, bottom) {
  ctx.save();

}
function setListExtent(top, bottom, contentH) {

}

const critterFx = { acc: null, heartEyes: false, rot: 0, nap: false, sq: 0 }; // reused every frame
function drawCritter(c) {
  const bounce = c.state === "happy" ? Math.sin(c.stateT * 18) * 8
    : c.dancing ? Math.sin(c.phase * 2) * 6
    : (c.idle === "wave" && c.state === "float") ? -Math.abs(Math.sin(time * 9)) * 4 : 0;
  let rot = 0;
  if (c.spinT > 0) rot = (1 - c.spinT / 0.6) * Math.PI * 2;
  else if (c.idle === "wave" && c.state === "float") rot = Math.sin(time * 9) * 0.2;
  // squash & stretch: a damped wobble after each hug/pet, plus a tiny idle "breath"
  let sq = c.sqT < 1.3 ? c.sqAmp * Math.sin(c.sqT * 21) * Math.exp(-c.sqT * 5.5) : 0;
  if (c.state === "float" && !c.sad) sq += Math.sin(c.phase * 0.9) * (c.idle === "nap" ? 0.035 : 0.02);
  const fx = critterFx;
  fx.acc = equippedFor(c.animal.id); fx.heartEyes = c.heartEyesT > 0; fx.rot = rot;
  fx.nap = c.idle === "nap" && c.state === "float"; fx.sq = sq;
  drawSprite(c.animal, c.x, c.y, c.scale * c.hugScale, c.shiny, bounce, c.sad, c.phase, fx);
  const s = c.scale * SPRITE_SIZE;
  if (c.idle === "wave" && c.state === "float") {
    font(10, true); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#ff70a8";
    ctx.fillText("hi!", c.x + s * 0.42, c.y - s * 0.5);
  }
  if (c.parade && c.state === "float") {
    font(11, true); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#ff80b0";
    ctx.fillText("♪", c.x, c.y - s * 0.62 + Math.sin(time * 6 + c.phase) * 3);
  }
}

function drawPowerup(p) {
  const pulse = 1 + Math.sin(time * 6 + p.ph) * 0.06;
  const r = 20 * pulse;
  const info = POWERUPS[p.type];
  ctx.save();
  ctx.globalAlpha = Math.min(1, p.life);
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = info.col; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.beginPath(); ctx.ellipse(p.x - r * 0.4, p.y - r * 0.45, r * 0.25, r * 0.14, -0.6, 0, Math.PI * 2); ctx.fill();
  if (p.type === "bighug") {
    drawPixelHeart(p.x, p.y, 11, "#ff5a9a");
  } else if (p.type === "sunbeam") {
    ctx.strokeStyle = "#ffb020"; ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * Math.PI * 2 + time;
      ctx.beginPath(); ctx.moveTo(p.x + Math.cos(a) * 9, p.y + Math.sin(a) * 9); ctx.lineTo(p.x + Math.cos(a) * 13, p.y + Math.sin(a) * 13); ctx.stroke();
    }
    ctx.fillStyle = "#ffd040"; ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, Math.PI * 2); ctx.fill();
  } else if (p.type === "magnet") {
    ctx.strokeStyle = "#ff5a5a"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(p.x, p.y - 2, 7, 0, Math.PI); ctx.stroke();
    ctx.fillStyle = "#e8e8f0";
    ctx.fillRect(p.x - 10, p.y - 7, 6, 5); ctx.fillRect(p.x + 4, p.y - 7, 6, 5);
  } else {
    ctx.strokeStyle = "#4a90d0"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y - 6); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 4, p.y + 2); ctx.stroke();
  }
  font(9, true); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#6a3a60";
  ctx.fillText(info.name.replace(/[!…]/g, ""), p.x, p.y + r + 8);
  ctx.restore();
}

function drawDrop(d) {
  const col = "hsl(" + ((d.hue + time * 60) % 360) + ",85%,68%)";
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(d.x, d.y, 11, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.beginPath();
  ctx.moveTo(d.x, d.y - 11);
  ctx.quadraticCurveTo(d.x + 7, d.y - 1, d.x, d.y + 7);
  ctx.quadraticCurveTo(d.x - 7, d.y - 1, d.x, d.y - 11);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.fillRect(d.x - 2, d.y - 2, 2, 3);
  ctx.restore();
}

function drawHUD() {

      ctx.beginPath(); ctx.arc(W / 2, 80, 14 + e * 26, 0, Math.PI * 2); ctx.fill();

    ctx.translate(W / 2, 80);

    ctx.textAlign = "center";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 3;
    ctx.strokeText("×" + combo, 0, 0);
