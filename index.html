// ===================== UI ACTIONS =====================
function openPanel(name) {
  if (scene === "play" || scene === "title") prevScene = scene;
  if (scene === "play" && name === "garden") prevScene = "pause"; // come back to a paused meadow, never an ambush
  scene = name;
  listScroll = 0; listMax = 0;
  drag = null;
}

function doUI(id) {
  if (!id) return;
  sfxClick();
  if (id === "play") { startPlay(); return; }
  if (id === "tut_next") { tutNext(); return; }
  if (id === "tut_skip") { finishTutorial(true); return; }
  if (id === "tut_replay") { tutorialDone = false; save(); startPlay(); return; }
  if (id === "tog_haptics") { hapticsOn = !hapticsOn; save(); if (hapticsOn) buzz("unlock", true); return; }
  if (id === "whatsnew") { openWhatsNew(scene); return; }
  if (id === "wn_ok") { closeWhatsNew(); return; }
  if (id === "sw_refresh") { save(); try { location.reload(); } catch (e) {} return; }
  if (id === "dawn") { newDawn(); return; }
  if (id === "shop") { if (tut && tut.step === 3) finishTutorial(false, true); shopTab = "critters"; openPanel("shop"); return; }
  if (id === "ach") { checkAchievements(); openPanel("achievements"); return; }
  if (id === "album") { albumNew = false; openPanel("album"); save(); return; }
  if (id === "settings") { openPanel("settings"); return; }
  if (id === "scr_up") { listScroll = clamp(listScroll - 180, 0, listMax); return; }
  if (id === "scr_dn") { listScroll = clamp(listScroll + 180, 0, listMax); return; }
  if (id === "tog_music") { setMusicOn(!musicOn); if (musicOn) ensureAudio(); return; }
  if (id === "tog_sfx") { setSfxOn(!sfxOn); sfxClick(); return; }
  if (id === "pause") { scene = "pause"; save(); return; }
  if (id === "resume") { scene = "play"; return; }
  if (id === "title") { scene = "title"; prevScene = "title"; activeEvent = null; drops = []; powerups = []; magnetT = slowT = 0; tut = null; save(); return; }
  if (id === "close") {
    if (scene === "garden") { leaveGarden(); return; }
    if (scene === "decor") { scene = "garden"; return; }
    scene = prevScene || "title"; return;
  }
  if (id === "garden") { if (tut) return; openGarden(); return; }
  if (id === "decor") { gSel = null; const ps = prevScene; openPanel("decor"); prevScene = ps; return; }
  if (id === "away_ok") { collectAway(); return; }
  if (id.startsWith("g_")) { gardenAction(id); return; }
  if (id.startsWith("dtab_")) { decorTab = id.slice(5); listScroll = 0; return; }
  if (id.startsWith("dbuy_")) {
    const did = id.slice(5);
    if (buyDecor(did)) { scene = "garden"; placeFromInv(did); }
    return;
  }
  if (id.startsWith("dplace_")) { const did = id.slice(7); scene = "garden"; placeFromInv(did); return; }
  if (id.startsWith("tab_")) { shopTab = id.slice(4); listScroll = 0; return; }
  if (id.startsWith("buy_")) {
    const a = ANIMALS.find(x => x.id === id.slice(4));
    if (a && !a.special && !unlocked[a.id] && joy >= a.cost) {
      joy -= a.cost; unlocked[a.id] = true; sfxUnlock(); buzz("unlock");
      toast(a.name + " joined! ♥", C.heart);
      checkAchievements(); save();
    }
    return;
  }
  if (id.startsWith("buybg_")) {
    const b = BACKGROUNDS.find(x => x.id === id.slice(6));
    if (b && !unlockedBgs[b.id] && joy >= b.cost) {
      joy -= b.cost; unlockedBgs[b.id] = true; bgId = b.id; sfxUnlock(); buzz("unlock");
      checkAchievements(); save();
    }
    return;
  }
  if (id.startsWith("usebg_")) {
    const bid = id.slice(6);
    if (unlockedBgs[bid]) { bgId = bid; save(); }
    return;
  }
  if (id.startsWith("buyacc_")) {
    const acc = SHOP_ACCS.find(x => x.id === id.slice(7));
    if (acc && !ownedAcc[acc.id] && joy >= acc.cost) {
      joy -= acc.cost; ownedAcc[acc.id] = true; sfxUnlock(); buzz("unlock");
      toast(acc.name + " added to your wardrobe!", C.heart);
      checkAchievements(); save();
    }
    return;
  }
  if (id.startsWith("wear_")) {
    const aid = id.slice(5);
    const opts = [null].concat(accOptions(aid).map(a => a.id));
    if (opts.length <= 1) { toast("Buy accessories in the Shop, or level up friendship!", C.textSoft); return; }
    const cur = equippedFor(aid);
    const next = opts[(opts.indexOf(cur) + 1) % opts.length];
    if (next) equipped[aid] = next; else delete equipped[aid];
    checkAchievements(); save();
  }
}

// ===================== INPUT =====================
function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  const clientX = e.clientX != null ? e.clientX : (e.touches && e.touches[0] && e.touches[0].clientX);
  const clientY = e.clientY != null ? e.clientY : (e.touches && e.touches[0] && e.touches[0].clientY);
  return { x: ((clientX - r.left) / r.width) * W, y: ((clientY - r.top) / r.height) * H };
}
const LIST_SCENES = { shop: true, album: true, achievements: true, decor: true };
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);

function tapGloom(p) {
  for (let i = gloomClouds.length - 1; i >= 0; i--) {
    const gc = gloomClouds[i];
    const rad = Math.max(26, 28 * gc.s);
    if (dist2(p.x, p.y, gc.x + 16 * gc.s, gc.y) < rad * rad) { shooGloom(gc); return true; }
  }
  return false;
}

function playTap(p) {
  if (gift && dist2(p.x, p.y, gift.x, gift.y) < 36 * 36) { openGift(); return; }
  for (const pu of powerups) {
    if (!pu.dead && dist2(p.x, p.y, pu.x, pu.y) < 27 * 27) { activatePowerup(pu); prune(powerups, notDead); return; }
  }
  let bestDrop = null, bdd = 26 * 26;
  for (const d of drops) { const dd = dist2(p.x, p.y, d.x, d.y); if (dd < bdd) { bestDrop = d; bdd = dd; } }

  let best = null, bestD = 1e9;
  for (let i = critters.length - 1; i >= 0; i--) {
    const c = critters[i];

    const rad = Math.max(24, c.scale * SPRITE_SIZE * 0.5);
    const d = dist2(p.x, p.y, c.x, c.y);
    if (d < rad * rad && d < bestD) { best = c; bestD = d; }
  }
  if (best) {
    for (const gc of gloomClouds) {
      if (dist2(best.x, best.y, gc.x + 16 * gc.s, gc.y) < 55 * 55) shooGloom(gc);
    }
    hugCritter(best);
    return;
  }
  for (let i = critters.length - 1; i >= 0; i--) {
    const c = critters[i];
    if (c.state !== "happy") continue;
    const rad = Math.max(24, c.scale * SPRITE_SIZE * 0.55);
    if (dist2(p.x, p.y, c.x, c.y) < rad * rad) { petCritter(c); return; }
  }
}

function updateTitle(dt) {

  gloomSpawnTimer -= dt;

    spawnGloomCloud(false);
    gloomSpawnTimer = 5;
  }
  for (const c of critters) updateCritter(c, dt);
  prune(critters, notDead);
  for (const gc of gloomClouds) {
    gc.x += gc.vx * dt * 0.5;
    if (gc.x < -80 || gc.x > W + 80) gc.dead = true;
  }
  prune(gloomClouds, notDead);
  updateParticles(dt);
}

function stepScene(dt) {
  if (scene === "title") {
    updateTitle(dt);
    drawTitle();
    drawStoryBanner();
  } else if (scene === "play") {
    updatePlay(dt);
    renderPlay();
  } else if (scene === "shop") {
    drawShop();
  } else if (scene === "achievements") {
    drawAchievements();
  } else if (scene === "album") {
    drawAlbum();
  } else if (scene === "settings") {
    drawSettings();
  } else if (scene === "pause") {
    renderPlay();

  } else if (scene === "whatsnew") {
    updateTitle(dt);

    drawWhatsNew(dt);
  } else if (scene === "garden") {
    updateGarden(dt);
    drawGarden();
  } else if (scene === "decor") {
    drawDecor();
  } else if (scene === "away") {
    if (awayReturn === "title") updateTitle(dt);

}

const perfLog = window.__HC_DEBUG ? [] : null; // per-frame JS cost, only when debugging
function frame(ts) {
  let dt = (ts - lastTs) / 1000;
  if (!(dt > 0)) dt = 1 / 60; // first frame / clock hiccups: never NaN or negative
  dt = Math.min(0.05, dt);
  lastTs = ts;
  frameDt = dt;
  time += dt;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, W, H);
  if (window.__HC_TEST) stepScene(dt);
  else {
    const t0 = perfLog ? performance.now() : 0;
    try { stepScene(dt); } catch (err) { console.error(err); }
    if (perfLog) { perfLog.push(performance.now() - t0); if (perfLog.length > 600) perfLog.shift(); }
  }
  requestAnimationFrame(frame);
}

  if (typeof location === "undefined" || !/^https?:$/.test(location.protocol)) return;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    // a newer version took over while we were open (first installs don't count)
    if (!hadController || updateReady) return;
    updateReady = true;
    showBanner("A fresh update arrived ✨", "Tap “Update” in Settings to load it", 3.2);
  });
  const reg = () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
      .then(r => { swReg = r; window.__hcSW = "registered"; })
      .catch(err => { window.__hcSW = "error: " + (err && err.message); });
  };
  if (document.readyState === "complete") reg(); else window.addEventListener("load", reg);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && swReg) { try { swReg.update(); } catch (e) {} }
  });
}

const DECOR_BY_ID = {};
for (const d of DECOR) DECOR_BY_ID[d.id] = d;

function decorUnlocked(d) {
  const u = d.unlock;
  if (!u) return true;
  if (u.friend) return maxFriend({ friendLvl }) >= u.friend;
  if (u.peak) return moodPeak >= u.peak;
  if (u.goal) return !!achievements[u.goal];
  return true;
}

// ---------- state ----------
function newGarden() {
  return { items: [], inv: {}, visits: 0, bubbles: 0, pets: 0, awayCollected: 0, placedEver: 0, welcomed: false, pending: null };
}
let garden = newGarden();
let lastActiveLoaded = 0;
let cozyCache = -1;
let gSel = null, gDrag = null;
let visitors = [], gBubbles = [];
let visitorT = 2, gAmbT = 0, hiddenAt = 0;

const isInt = v => typeof v === "number" && isFinite(v) && Math.floor(v) === v;
function normalizeGarden(g) {
  const out = newGarden();
  if (!isObj(g)) return out;
  for (const k of ["visits", "bubbles", "pets", "awayCollected", "placedEver"]) out[k] = isFinite(g[k]) && g[k] > 0 ? Math.floor(g[k]) : 0;
  out.welcomed = !!g.welcomed;
  if (isObj(g.inv)) for (const id in g.inv) if (DECOR_BY_ID[id] && g.inv[id] > 0) out.inv[id] = Math.floor(g.inv[id]);
  if (Array.isArray(g.items)) {
    for (const it of g.items) {
      if (!isObj(it) || !DECOR_BY_ID[it.id]) continue;
      const item = { id: it.id, c: isInt(it.c) ? it.c : 0, row: isInt(it.row) ? it.row : 0, rot: DECOR_BY_ID[it.id].rot && isInt(it.rot) ? ((it.rot % 4) + 4) % 4 : 0, f: it.f ? 1 : 0 };
      // anything that no longer fits goes safely back to storage (never lost)
      if (fits(item, item.c, item.row, item.rot, out.items)) out.items.push(item);
      else out.inv[item.id] = (out.inv[item.id] || 0) + 1;
    }
  }
  if (isObj(g.pending) && g.pending.hearts >= 0) {
    const p = g.pending;
    out.pending = {
      secs: +p.secs || 0, hearts: Math.floor(+p.hearts || 0), visits: Math.floor(+p.visits || 0),
      visitors: Array.isArray(p.visitors) ? p.visitors.filter(id => ANIMALS.some(a => a.id === id)).slice(0, 5) : [],
      presents: Array.isArray(p.presents) ? p.presents.filter(isObj).slice(0, 6) : [],
    };
  }
  return out;
}
function serializeGarden() {
  return {
    items: garden.items.map(it => ({ id: it.id, c: it.c, row: it.row, rot: it.rot, f: it.f })),
    inv: garden.inv, visits: garden.visits, bubbles: garden.bubbles, pets: garden.pets,
    awayCollected: garden.awayCollected, placedEver: garden.placedEver, welcomed: garden.welcomed, pending: garden.pending,
  };
}

function gardenCozy() {
  if (cozyCache >= 0) return cozyCache;
  // duplicates count for half as much each time: decorating beats spamming one cheap item
  const seen = {};
  let z = 0;
  for (const it of garden.items) {
    const d = DECOR_BY_ID[it.id], k = seen[it.id] || 0;
    z += d.cozy * Math.pow(0.5, k);
    seen[it.id] = k + 1;
  }
  cozyCache = Math.round(z);
  return cozyCache;
}
function gardenChanged() { cozyCache = -1; checkAchievements(); save(); }
function gardenHas() { const h = {}; for (const it of garden.items) h[it.id] = true; return h; }
function invCount(id) { return garden.inv[id] || 0; }
function placedCount(id) { let n = 0; for (const it of garden.items) if (it.id === id) n++; return n; }

// ---------- grid geometry ----------
function itemDims(id, rot) { const d = DECOR_BY_ID[id]; return rot & 1 ? [d.fh, d.fw] : [d.fw, d.fh]; }
function fits(it, c, row, rot, list) {
  const [w, h] = itemDims(it.id, rot);
  if (c < 0 || row < 0 || c + w > G_COLS || row + h > G_ROWS) return false;
  for (const o of list || garden.items) {
    if (o === it) continue;
    const [ow, oh] = itemDims(o.id, o.rot);
    if (c < o.c + ow && o.c < c + w && row < o.row + oh && o.row < row + h) return false;
  }
  return true;
}
function itemRect(it) {
  const [w, h] = itemDims(it.id, it.rot);
  return { x: it.c * G_CELL, y: gy0() + it.row * G_CELL, w: w * G_CELL, h: h * G_CELL };
}
function findFreeSpot(it, rot) {
  let best = null, bd = 1e9;
  for (let row = 0; row < G_ROWS; row++) for (let c = 0; c < G_COLS; c++) {

// ---------- placement ----------
function placeFromInv(id) {

  garden.inv[id]--;
  if (!garden.inv[id]) delete garden.inv[id];
  it.c = spot[0]; it.row = spot[1];

  const R = itemRect(it);
  popFx(R.x + R.w / 2, R.y + R.h / 2, "#fff4a0", 1);
  spawnSparkles(R.x + R.w / 2, R.y + R.h / 2, 12);

}
function buyDecor(id) {
  const d = DECOR_BY_ID[id];

  joy -= d.cost;
  garden.inv[id] = invCount(id) + 1;

}
function gardenAction(id) {
  const it = gSel;

  if (id === "g_store") {
    releaseItem(it);
    garden.items.splice(garden.items.indexOf(it), 1);
    garden.inv[it.id] = invCount(it.id) + 1;
    gSel = null;
    toast(DECOR_BY_ID[it.id].name + " stored", C.textSoft);
    sfxClick();

  }
  if (id === "g_flip") { it.f ^= 1; releaseItem(it); sfxPlace(); save(); return; }
  if (id === "g_rot" && DECOR_BY_ID[it.id].rot) {
    const nr = (it.rot + 1) % 4;
    let spot = fits(it, it.c, it.row, nr) ? [it.c, it.row] : null;
    if (!spot) {
      const [w, h] = itemDims(it.id, nr);
      for (let dr = -h; dr <= h && !spot; dr++) for (let dc = -w; dc <= w && !spot; dc++) if (fits(it, it.c + dc, it.row + dr, nr)) spot = [it.c + dc, it.row + dr];
    }
    if (!spot) { toast("No room to turn it here", C.textSoft); sfxNope(); return; }
    it.rot = nr; it.c = spot[0]; it.row = spot[1];
    releaseItem(it); sfxPlace(); save();
  }
}

// ---------- garden input ----------
function itemAt(p) {
  // topmost first (reverse depth order); hit the footprint or the visible art above it
  let best = null, bk = -1;
  for (const it of garden.items) {
    const R = itemRect(it), d = DECOR_BY_ID[it.id];
    const artTop = it.rot ? R.y : Math.min(R.y, R.y + R.h - d.ah * G_U);
    const artL = it.rot ? R.x : Math.min(R.x, R.x + R.w / 2 - d.aw * G_U / 2);
    const artW = it.rot ? R.w : Math.max(R.w, d.aw * G_U);
    if (pointIn(p.x, p.y, artL, artTop, artW, R.y + R.h - artTop) && R.y + R.h > bk) { best = it; bk = R.y + R.h; }
  }
  return best;
}
function gardenDown(p, touch) {
  for (let i = gBubbles.length - 1; i >= 0; i--) {
    const b = gBubbles[i];
    if (dist2(p.x, p.y, b.x, b.y) < 22 * 22) { collectBubble(b); return; }
  }
  if (p.y < 60) return;
  if (gSel) {
    const R = itemRect(gSel);
    if (pointIn(p.x, p.y, R.x - 6, R.y - 10, R.w + 12, R.h + 16)) { startItemDrag(gSel, p, touch); return; }
  }
  for (let i = visitors.length - 1; i >= 0; i--) {
    const v = visitors[i];
    if (v.state === "act" && v.item && DECOR_BY_ID[v.item.id].act === "house") continue;
    if (dist2(p.x, p.y, v.x, v.y - 18) < 22 * 22) { petVisitor(v); return; }
  }
  const it = itemAt(p);
  if (it) { startItemDrag(it, p, touch); return; }
  gSel = null;
}
function startItemDrag(it, p, touch) {
  const R = itemRect(it);
  gDrag = { item: it, ox: p.x - R.x, oy: p.y - R.y, sx: p.x, sy: p.y, moved: false, valid: true, oc: it.c, orow: it.row, lift: 0 };
}
function gardenMove(p) {
  const g = gDrag;
  if (!g) return;
  if (!g.moved && dist2(p.x, p.y, g.sx, g.sy) > 64) {
    g.moved = true; gSel = g.item; releaseItem(g.item); sfxClick();
  }
  if (!g.moved) return;
  const [w, h] = itemDims(g.item.id, g.item.rot);
  const c = clamp(Math.round((p.x - g.ox) / G_CELL), 0, G_COLS - w);
  const row = clamp(Math.round((p.y - g.oy - g.lift - gy0()) / G_CELL), 0, G_ROWS - h);
  if (c !== g.item.c || row !== g.item.row) {
    g.item.c = c; g.item.row = row;
    g.valid = fits(g.item, c, row, g.item.rot);
  }
}
function gardenUp(p, cancelled) {
  const g = gDrag;
  gDrag = null;
  if (!g) return;
  if (!g.moved) { gSel = gSel === g.item ? gSel : g.item; if (gSel) sfxClick(); return; }
  if (!cancelled && fits(g.item, g.item.c, g.item.row, g.item.rot)) {
    const R = itemRect(g.item);
    spawnSparkles(R.x + R.w / 2, R.y + R.h - 6, 8);
    sfxPlace(); buzz("pet");
    save();
  } else {
    g.item.c = g.oc; g.item.row = g.orow;
    sfxNope();
  }
}

// ---------- while you were away ----------
function computeAway(sec, cozy, animals, rng) {
  rng = rng || Math.random;
  const s = Math.max(0, Math.min(AWAY_CAP, +sec || 0));
  if (!(cozy > 0) || s < AWAY_MIN) return null;
  const hrs = s / 3600;
  const hearts = Math.floor((15 + cozy * 4) * hrs);
  if (hearts < 1) return null;
  const visits = Math.max(1, Math.floor(hrs * Math.min(12, 2 + cozy / 15)));
  const pool = (animals || []).map(a => a.id);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  const vis = pool.slice(0, Math.min(5, visits));
  const presents = [];
  const nP = cozy >= 20 && vis.length ? Math.min(4, Math.floor(hrs / 2)) : 0;
  const cheap = DECOR.filter(d => d.cost <= 260 && !d.unlock);
  for (let i = 0; i < nP; i++) {
    const from = vis[i % vis.length];
    if (rng() < 0.5) presents.push({ from, item: cheap[Math.floor(rng() * cheap.length)].id });
    else presents.push({ from, hearts: 40 + Math.round(cozy) });
  }
  return { secs: s, hearts, visits, visitors: vis, presents };
}
function mergeAway(a, b) {
  if (!a) return b;
  if (!b) return a;
  const vis = a.visitors.slice();
  for (const id of b.visitors) if (vis.indexOf(id) < 0 && vis.length < 5) vis.push(id);
  return { secs: a.secs + b.secs, hearts: a.hearts + b.hearts, visits: a.visits + b.visits, visitors: vis, presents: a.presents.concat(b.presents).slice(0, 6) };
}
function grantAway(sec) {
  const r = computeAway(sec, gardenCozy(), unlockedList());
  if (!r) return false;
  garden.pending = mergeAway(garden.pending, r);
  save();
  return true;
}
function awayTotal(p) { let t = p.hearts; for (const pr of p.presents) if (pr.hearts) t += pr.hearts; return t; }
let awayReturn = "title", awayT = 0;
function openAway(from) {
  if (!garden.pending) return;
  awayReturn = from === "play" ? "pause" : (from === "away" || from === "whatsnew" ? "title" : from || "title");
  scene = "away"; awayT = 0;
}
function collectAway() {
  const p = garden.pending;
  if (p) {
    const total = awayTotal(p);
    joy += total;
    for (const pr of p.presents) if (pr.item && DECOR_BY_ID[pr.item]) garden.inv[pr.item] = invCount(pr.item) + 1;
    garden.awayCollected++;
    garden.pending = null;
    sfxGift(); buzz("gift");
    spawnConfetti(30);
    toast("+" + total + " ♥ from your garden!", C.heart);
    checkAchievements();
    save();
  }
  scene = awayReturn || "title";
}
function fmtDur(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? h + "h " + m + "m" : Math.max(1, m) + " min";
}

// ---------- away tracking ----------
function checkAwayOnBoot() {
  if (lastActiveLoaded > 0) grantAway((Date.now() - lastActiveLoaded) / 1000);
  return !!garden.pending;
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (!hiddenAt) return;
  const sec = (Date.now() - hiddenAt) / 1000;
  hiddenAt = 0;
  if (grantAway(sec) && scene !== "away" && scene !== "whatsnew") openAway(scene);
});

// ===================== BOOT =====================
load();
if (freshSave) {
  // brand-new friend: guided first play, no "what's new" card
  tutorialDone = false;
  lastVersionSeen = APP_VERSION;
} else if (lastVersionSeen < APP_VERSION) {
  checkAwayOnBoot();
  openWhatsNew("title"); // the away card (if any) follows when this closes
} else if (checkAwayOnBoot()) {
  openAway("title");
}
initDecor();
resize();
for (let i = 0; i < 3; i++) spawnCritter();
requestAnimationFrame(frame);
setupPWA();

if (window.__HC_TEST || window.__HC_DEBUG) {
  window.__HC = {
    get s() {
      return { mood, joy, scene, critters, gloomClouds, powerups, drops, gift, activeEvent, stats, totalHugs,
        critterHugs, friendLvl, ownedAcc, equipped, musicOn, sfxOn, uiButtons, H, combo, magnetT, slowT, levelUpFx,
        listMax, listScroll, unlocked, achievements, giftStreak, lastGiftDay,
        tut, tutorialDone, hapticsOn, lastVersionSeen, freshSave, particles, floatTexts, storyBanner, comboPop, time,
        garden, visitors, gBubbles, gSel, gDrag, cozy: gardenCozy(), decorTab, awayReturn, prevScene };
    },
    set: (k, v) => {
      if (k === "mood") mood = v; else if (k === "joy") joy = v; else if (k === "scene") scene = v;
      else if (k === "eventTimer") eventTimer = v; else if (k === "powerTimer") powerTimer = v;
      else if (k === "lastGiftDay") lastGiftDay = v; else if (k === "giftStreak") giftStreak = v;
      else if (k === "tutorialDone") tutorialDone = v;
      else if (k === "garden") { garden = normalizeGarden(v); cozyCache = -1; }
      else if (k === "gSel") gSel = v;
      else if (k === "lastActiveLoaded") lastActiveLoaded = v;
    },
    music, SONGS, SONG_ERRORS, frame, ensureAudio, musicTick, startEvent, spawnPowerup, activatePowerup,
    hugCritter, doUI, save, load, openGift, checkDailyGift, setMusicOn, setSfxOn, playTap, targetTier,
    APP_VERSION, tutBubbleTop, TUT_STEPS, shooGloom, showBanner, perfLog,
    DECOR, DECOR_BY_ID, G_CELL, G_COLS, G_ROWS, gy0, itemRect, fits, findFreeSpot, artToScreen, computeAway, mergeAway, grantAway,
    openGarden, leaveGarden, placeFromInv, buyDecor, gardenAction, gardenCozy, normalizeGarden, serializeGarden, spawnVisitor,
    updateGarden, collectBubble, dropBubble, openAway, collectAway, checkAwayOnBoot, decorUnlocked, toolbarRect, AWAY_CAP, AWAY_MIN,
    gardenDown, gardenMove, gardenUp, checkAchievements, GOALS,
    get audioState() { return audioCtx ? audioCtx.state : "none"; },
  };
}

})();
